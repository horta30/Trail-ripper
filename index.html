<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>Trail Ripper — Valpo POV Arcade</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#06070d;display:flex;align-items:center;justify-content:center}canvas{width:960px;height:540px;max-width:100vw;max-height:100vh;image-rendering:pixelated;image-rendering:crisp-edges;box-shadow:0 0 70px rgba(255,190,40,.22);background:#000;touch-action:none}.hint{position:fixed;bottom:12px;left:0;right:0;text-align:center;color:#fff8;font:12px monospace;pointer-events:none}
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<div class="hint">← → mover · ↑/SPACE saltar · Q backflip · E whip · click/touch iniciar</div>
<script>
const canvas=document.getElementById('game'), screen=canvas.getContext('2d'); screen.imageSmoothingEnabled=false;
const W=320,H=180,SCALE=3;
const px=document.createElement('canvas'); px.width=W; px.height=H;
const ctx=px.getContext('2d'); ctx.imageSmoothingEnabled=false;
let state='menu', frame=0, dist=0, score=0, best=Number(localStorage.valpoBest||0), lives=3;
let x=0,vx=0,y=0,vy=0,onGround=true,speed=1.4,shake=0,combo=0,trick='',trickTimer=0,rot=0,whip=0;
let obstacles=[],spawn=0,keys={},touchX=null;
const colors=['#e44b54','#25a6d9','#f2c14e','#50c878','#df7adf','#f06f2f','#f5eee2'];
function rnd(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function zY(z){return 58+z*120} function zW(z){return 18+z*250} function laneX(nx,z){return W/2+nx*zW(z)/2}
function roadL(z){return W/2-zW(z)/2} function roadR(z){return W/2+zW(z)/2}
function reset(){state='play';dist=0;score=0;lives=3;x=0;vx=0;y=0;vy=0;onGround=true;speed=1.4;obstacles=[];spawn=0;combo=0;trick='';rot=0;whip=0;}
addEventListener('keydown',e=>{keys[e.code]=true;if(state!=='play')reset();}); addEventListener('keyup',e=>keys[e.code]=false);
canvas.addEventListener('pointerdown',e=>{if(state!=='play')reset(); const r=canvas.getBoundingClientRect(); touchX=(e.clientX-r.left)/r.width;});
canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect(); touchX=(e.clientX-r.left)/r.width;});
canvas.addEventListener('pointerup',()=>touchX=null);
function jump(power=5.8){if(onGround){vy=-power;onGround=false;combo=0;}}
function addObstacle(){let type=Math.random()<.36?'ramp':Math.random()<.62?'stairs':Math.random()<.82?'barrel':'gap';obstacles.push({z:0,nx:rnd(-.72,.72),type,hit:false,used:false});}
function update(){frame++; speed=Math.min(3.9,1.45+dist*.0009); dist+=speed; score=Math.floor(dist*3)+combo*250;
 let ax=0; if(keys.ArrowLeft||keys.KeyA)ax=-1; if(keys.ArrowRight||keys.KeyD)ax=1; if(touchX!==null)ax=touchX<.38?-1:touchX>.62?1:0;
 vx+=ax*.028; vx*=.86; x=clamp(x+vx,-.9,.9);
 if(keys.Space||keys.ArrowUp)jump();
 if(!onGround){vy+=.22;y+=vy;if(keys.KeyQ){rot+=.16; trick='BACKFLIP'; trickTimer=45;} if(keys.KeyE){whip=Math.sin(frame*.55)*1.2; trick='WHIP'; trickTimer=45;} if(y>=0){y=0;vy=0;onGround=true;if(Math.abs(rot)>5.4){combo++;score+=1250}else if(Math.abs(whip)>.75){combo++;score+=450}rot=0;whip=0;}}
 if(trickTimer>0)trickTimer--; else trick='';
 spawn-=speed; if(spawn<=0){addObstacle();spawn=rnd(24,43)-speed*2;}
 for(let i=obstacles.length-1;i>=0;i--){let o=obstacles[i];o.z+=speed*.011;if(o.type==='ramp'&&!o.used&&o.z>.83&&o.z<1.04&&Math.abs(x-o.nx)<.23){o.used=true;jump(7.7);combo++;}
  if(!o.hit&&o.type!=='ramp'&&o.z>.88&&o.z<1.05&&Math.abs(x-o.nx)<.18&&y>-16){o.hit=true;lives--;shake=10;if(lives<=0){best=Math.max(best,score);localStorage.valpoBest=best;state='over';}else{vy=-4;onGround=false;}}
  if(o.z>1.25)obstacles.splice(i,1);
 }}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function text(t,x,y,size=8,c='#fff',align='left'){ctx.fillStyle=c;ctx.font=`bold ${size}px monospace`;ctx.textAlign=align;ctx.fillText(t,x,y)}
function drawSky(){let g=ctx.createLinearGradient(0,0,0,75);g.addColorStop(0,'#0f61a6');g.addColorStop(.65,'#43a5d8');g.addColorStop(1,'#f4c06b');ctx.fillStyle=g;ctx.fillRect(0,0,W,78);rect(0,48,W,14,'#1b6c94'); for(let i=0;i<36;i++)rect((i*37-frame*.12)%W,53+(i%3),9,1,'#aee8ff');
 for(let i=0;i<8;i++){rect(i*48+6,27+(i%2)*5,14,3,'#fff');rect(i*48+14,24+(i%2)*5,18,4,'#fff');}
}
function drawHills(){ctx.fillStyle='#4b3760';ctx.beginPath();ctx.moveTo(0,58);for(let i=0;i<=W;i+=10)ctx.lineTo(i,45+Math.sin(i*.035)*7+Math.sin(i*.011)*10);ctx.lineTo(W,65);ctx.lineTo(0,65);ctx.fill(); for(let i=0;i<90;i++)rect((i*29+frame*.25)%W,51+(i*7)%15,1,1,i%4?'#ffd27a':'#fff1b0');}
function house(x,y,s,i){let c=colors[i%colors.length]; rect(x-10*s,y-18*s,20*s,18*s,c); rect(x-12*s,y-23*s,24*s,6*s,'#7c3b22');rect(x-6*s,y-12*s,4*s,4*s,'#ffe08a');rect(x+3*s,y-12*s,4*s,4*s,'#ffe08a');rect(x-2*s,y-6*s,5*s,6*s,'#2a1b24')}
function drawCity(){for(let side=-1;side<=1;side+=2){for(let i=0;i<12;i++){let z=((i/12)+(frame*.002))%1, s=.28+z*.8, y=zY(z)-6, xx=(side<0?roadL(z)-18*s:roadR(z)+18*s);house(xx,y,s,i+(side>0?4:0));}}}
function drawRoad(){ctx.fillStyle='#181822';ctx.fillRect(0,58,W,122);ctx.beginPath();ctx.moveTo(roadL(0),58);ctx.lineTo(roadR(0),58);ctx.lineTo(roadR(1),H);ctx.lineTo(roadL(1),H);ctx.closePath();ctx.fillStyle='#6d6b70';ctx.fill();
 for(let i=0;i<18;i++){let z=((i/18)+(frame*speed*.006))%1,y=zY(z);ctx.strokeStyle='rgba(30,30,35,.45)';ctx.lineWidth=1+z*2;ctx.beginPath();ctx.moveTo(roadL(z),y);ctx.lineTo(roadR(z),y);ctx.stroke();}
 for(let n=-3;n<=3;n++){ctx.strokeStyle='rgba(40,35,38,.28)';ctx.beginPath();ctx.moveTo(laneX(n*.22,0),58);ctx.lineTo(laneX(n*.22,1),180);ctx.stroke();}
 for(let i=0;i<7;i++){let z=((i/7)+(frame*speed*.004))%1;if(i%2){ctx.fillStyle='#f8d24b';ctx.beginPath();ctx.moveTo(laneX(-.03,z),zY(z));ctx.lineTo(laneX(.03,z),zY(z));ctx.lineTo(laneX(.04,z+.09),zY(z+.09));ctx.lineTo(laneX(-.04,z+.09),zY(z+.09));ctx.fill();}}
}
function drawCrowd(){for(let s=-1;s<=1;s+=2){for(let i=0;i<28;i++){let z=((i/28)+(frame*.004))%1, y=zY(z)+4, x0=s<0?roadL(z)-5-z*25:roadR(z)+5+z*25;rect(x0,y,2+z*2,5+z*5,['#111','#e34','#3af','#fd3','#fff'][i%5]);}}
 rect(8,98,54,9,'#111');text('OXFORD',12,106,8,'#fff'); rect(255,100,55,9,'#162b88');text('RED BULL',259,108,7,'#ffd23a');}
function drawObstacles(){let arr=[...obstacles].sort((a,b)=>a.z-b.z);for(const o of arr){if(o.z<.05)continue;let s=.35+o.z*1.6, xx=laneX(o.nx,o.z), yy=zY(o.z);ctx.save();ctx.translate(xx,yy);ctx.scale(s,s); if(o.type==='ramp'){rect(-10,-4,20,4,'#bfae9a');ctx.fillStyle='#9b8d7c';ctx.beginPath();ctx.moveTo(-12,0);ctx.lineTo(12,0);ctx.lineTo(12,-3);ctx.lineTo(-12,-12);ctx.fill();text('JUMP',-8,-5,4,'#111');} else if(o.type==='stairs'){for(let k=0;k<4;k++)rect(-13+k*3,-k*3,26-k*5,3,'#aaa');} else if(o.type==='barrel'){rect(-6,-12,12,12,o.hit?'#f22':'#f2c14e');rect(-7,-13,14,2,'#222');} else {rect(-16,-3,32,6,'#171717');rect(-16,-6,32,2,'#ffcc33');} ctx.restore();}}
function drawPOV(){let bob=Math.sin(frame*.28)*1.2+(onGround?0:y*.08);let cx0=W/2+x*18, cy=154+bob; ctx.save();ctx.translate(cx0,cy);ctx.rotate(vx*.65+whip*.08);
 ctx.strokeStyle='#111';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-78,6);ctx.quadraticCurveTo(0,-8,78,6);ctx.stroke();ctx.strokeStyle='#6e6e6e';ctx.lineWidth=2;ctx.stroke();
 rect(-99,1,28,15,'#1646c7');rect(71,1,28,15,'#1646c7');rect(-22,4,44,24,'#0d43b8');rect(-9,-5,18,18,'#0b0b0f');rect(-5,-1,10,10,'#555');
 ctx.strokeStyle='#c58a5a';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-70,7);ctx.lineTo(-105,32);ctx.moveTo(70,7);ctx.lineTo(105,32);ctx.stroke();ctx.strokeStyle='#1646c7';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(-76,4);ctx.lineTo(-104,22);ctx.moveTo(76,4);ctx.lineTo(104,22);ctx.stroke();ctx.restore();
 if(!onGround){text('AIR',W/2,35,11,'#ffd23a','center'); if(rot)text('BACKFLIP x'+combo,W/2,48,8,'#fff','center'); if(Math.abs(whip)>.1)text('WHIP',W/2,60,8,'#fff','center');}}
function hud(){rect(4,4,64,20,'#000');text('TIEMPO',8,12,6,'#ffd23a');let t=Math.max(0,90-Math.floor(dist/45));text('01:'+String(t).padStart(2,'0'),8,23,11,'#fff');rect(128,4,64,20,'#000');text('PUNTOS',141,12,6,'#ffd23a');text(String(score).padStart(5,'0'),139,24,11,'#fff');rect(249,4,67,20,'#000');text('VIDAS',257,12,6,'#ffd23a');text('♥'.repeat(lives),258,24,11,'#f33');rect(250,158,65,18,'#000');text('KM/H',256,166,6,'#ffd23a');text(Math.floor(speed*26),285,174,13,'#fff','right'); if(trickTimer>0){rect(6,56,76,30,'#000');text('TRUCO!',10,66,8,'#ffd23a');text(trick,10,78,9,'#fff');}}
function overlay(title,sub){ctx.fillStyle='rgba(0,0,0,.72)';ctx.fillRect(0,0,W,H);text(title,W/2,78,18,'#ffd23a','center');text(sub,W/2,98,8,'#fff','center');text('VALPARAISO CERRO ABAJO - STAGE CRONO ARCADE',W/2,127,7,'#9ae6ff','center');}
function render(){if(state==='play')update();frame++; ctx.save();ctx.translate((shake?rnd(-shake,shake):0),(shake?rnd(-shake,shake):0));if(shake)shake*=.82; drawSky();drawHills();drawRoad();drawCity();drawCrowd();drawObstacles();drawPOV();hud();ctx.restore(); if(state==='menu')overlay('TRAIL RIPPER','click / tecla para bajar el cerro'); if(state==='over')overlay('CAIDA - GAME OVER','score '+score+' · record '+best+' · click para reintentar'); screen.clearRect(0,0,960,540);screen.drawImage(px,0,0,960,540);requestAnimationFrame(render)}
render();
</script>
</body>
</html>
