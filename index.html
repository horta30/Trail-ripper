<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>CERRO ABAJO — Stage Crono Arcade</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#13100a;touch-action:none}
body{display:flex;justify-content:center;align-items:center;font-family:'Segoe UI',Arial,sans-serif}
canvas{
  position:absolute;width:800px;height:450px;transform-origin:center center;
  box-shadow:0 0 60px rgba(255,150,40,.25);cursor:crosshair;touch-action:none;
}
#c{image-rendering:auto}
#muteBtn{
  position:fixed;
  top:max(14px,env(safe-area-inset-top));
  right:max(14px,env(safe-area-inset-right));
  z-index:50;width:44px;height:44px;border-radius:50%;
  background:rgba(38,26,16,.78);border:2px solid rgba(74,184,64,.7);color:#fff;
  font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
  box-shadow:0 2px 10px rgba(0,0,0,.4);
}
#muteBtn:active{transform:scale(.9)}
#fsBtn{
  position:fixed;
  top:max(14px,env(safe-area-inset-top));
  left:max(14px,env(safe-area-inset-left));
  z-index:50;width:44px;height:44px;border-radius:50%;
  background:rgba(38,26,16,.78);border:2px solid rgba(168,71,42,.6);color:#fff;
  font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
  box-shadow:0 2px 10px rgba(0,0,0,.4);
}
#fsBtn:active{transform:scale(.9)}
</style>
</head>
<body>
<canvas id="c" width="800" height="450"></canvas>
<button id="muteBtn" aria-label="Silenciar música">🔊</button>
<button id="fsBtn" aria-label="Pantalla completa">⛶</button>
<script>
var cv=document.getElementById('c'),mctx=cv.getContext('2d');
mctx.imageSmoothingEnabled=true;

// ─── Full resolution — nítido, sin downscale ────────────────────────
var OW=800, OH=450;
var oc=document.createElement('canvas'); oc.width=OW; oc.height=OH;
var cx=oc.getContext('2d'); cx.imageSmoothingEnabled=true;

var W=800,H=450,HY=H*.34,RY=H*.70;
var CAMX=W/2;

// ─── AUDIO — SFX ─────────────────────────────────────────────────────
var AC=null;
function initAC(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();}
function tone(freq,dur,vol,type,sweep){
  if(!AC)return;
  var o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);
  o.type=type||'square';
  o.frequency.setValueAtTime(freq,AC.currentTime);
  if(sweep)o.frequency.exponentialRampToValueAtTime(sweep,AC.currentTime+dur*.8);
  g.gain.setValueAtTime(vol||.15,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);
  o.start();o.stop(AC.currentTime+dur);
}
function noise(dur,vol){
  if(!AC)return;
  var buf=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate);
  var d=buf.getChannelData(0);
  for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  var s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();
  f.type='bandpass';f.frequency.value=350;
  s.buffer=buf;s.connect(f);f.connect(g);g.connect(AC.destination);
  g.gain.value=vol||.4;s.start();
}
function sndJump(){tone(280,0.18,.12,'sine',560);}
function sndLand(){tone(160,0.08,.08,'sine');}
function sndKicker(){tone(200,0.05,.1,'sine',900);setTimeout(function(){tone(500,.2,.1,'sine',1100);},60);}
function sndCrash(){noise(.35,.5);tone(180,.4,.12,'sawtooth',60);}
function sndScore(){tone(880,.08,.07,'sine',1100);}
function sndTrick(){tone(660,.07,.1,'square',990);setTimeout(function(){tone(990,.12,.1,'square',1320);},70);}
function sndTurbo(){tone(120,.5,.18,'sawtooth',680);}

// ─── AUDIO — CHIPTUNE LOOP ──────────────────────────────────────────
var musicOn=false, musicStep=0, musicNextTime=0;
var BPM=148, STEP=60/BPM/2;
var bass=[110,0,110,98, 0,98,87,0, 87,0,87,98, 0,98,110,0];
var lead=[0,440,0,554, 659,0,554,0, 0,440,0,392, 440,0,494,0];
function toneAt(t,freq,dur,vol,type){
  if(!AC||!freq)return;
  var o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);
  o.type=type||'square';
  o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.start(t);o.stop(t+dur+.02);
}
function scheduleMusicStep(){
  if(!musicOn||!AC)return;
  var t=musicNextTime;
  toneAt(t,bass[musicStep%bass.length],STEP*.92,.045,'square');
  toneAt(t,lead[musicStep%lead.length],STEP*.8,.03,'triangle');
  musicStep++;musicNextTime+=STEP;
  var delay=(musicNextTime-AC.currentTime-.05)*1000;
  setTimeout(scheduleMusicStep,Math.max(0,delay));
}
function startMusic(){if(!AC||musicOn||muted)return;musicOn=true;musicStep=0;musicNextTime=AC.currentTime+.05;scheduleMusicStep();}
function stopMusic(){musicOn=false;}

var muted=false;
var muteBtn=document.getElementById('muteBtn');
function toggleMute(e){
  e.preventDefault();e.stopPropagation();
  muted=!muted;
  muteBtn.textContent=muted?'🔇':'🔊';
  if(muted)stopMusic();
  else if(phase==='playing')startMusic();
}
muteBtn.addEventListener('click',toggleMute);
muteBtn.addEventListener('touchstart',toggleMute,{passive:false});

// ─── PANTALLA COMPLETA (clave para mobile embebido en iframe) ──────
var fsBtn=document.getElementById('fsBtn');
var fsSupported = !!(document.documentElement.requestFullscreen ||
                      document.documentElement.webkitRequestFullscreen);
if(!fsSupported){
  fsBtn.style.display='none'; // iOS Safari en iPhone no soporta fullscreen de elementos
} else {
  function toggleFullscreen(e){
    e.preventDefault();e.stopPropagation();
    var isFs = document.fullscreenElement || document.webkitFullscreenElement;
    if(!isFs){
      var el=document.documentElement;
      if(el.requestFullscreen)el.requestFullscreen().catch(function(){});
      else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
    } else {
      if(document.exitFullscreen)document.exitFullscreen();
      else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
    }
  }
  fsBtn.addEventListener('click',toggleFullscreen);
  fsBtn.addEventListener('touchstart',toggleFullscreen,{passive:false});
  document.addEventListener('fullscreenchange',function(){
    fsBtn.textContent=document.fullscreenElement?'✕':'⛶';
    setTimeout(resize,80);
  });
  document.addEventListener('webkitfullscreenchange',function(){
    fsBtn.textContent=document.webkitFullscreenElement?'✕':'⛶';
    setTimeout(resize,80);
  });
}

// ─── PERSPECTIVE ─────────────────────────────────────────────────
function tL(z){return CAMX-(60+(480-60)*z)/2;}
function tR(z){return CAMX+(60+(480-60)*z)/2;}
function wX(n,z){return CAMX+n*(60+(480-60)*z)/2;}
function wY(z){return HY+(RY-HY)*z;}
function sc(z){return .10+.90*z;}

// ─── STATE ─────────────────────────────────────────────────────────
var phase='menu',score=0,best=0,points=0,speed=1.6,dist=0,lives=3,fn=0;
var rNX=0,rVX=0,rJ=0,rJV=0,rGnd=true,inv=0,crash=false,cT=0;
var obs=[],spc=0,tsc=0;
var lastScore=0;
var keys={},tDir=0,tJump=false;
var hills=[];
for(var xi=0;xi<=W;xi+=18)hills.push(H*.18+Math.sin(xi*.006)*35+Math.sin(xi*.018)*18);

var whipFlag=false, rampFlag=false;
var trick=null;
var turbo=0, turboActive=0, turboFlashT=0;
// Rider animation state
var flipAngle=0, flipDir=0, flipDone=false;
var wheelieTime=0, wheelieLean=0;

// ─── CONTROLS ──────────────────────────────────────────────────────
document.addEventListener('keydown',function(e){
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowLeft','ArrowRight'].indexOf(e.code)>=0)e.preventDefault();
  if(phase!=='playing'){initAC();go();}
});
document.addEventListener('keyup',function(e){keys[e.code]=false;});
function getTouchX(e){
  var r=cv.getBoundingClientRect();
  var tx=e.touches[0].clientX, ty=e.touches[0].clientY;
  if(cv._portrait){
    var relY=(ty-r.top)/r.height;
    return (1-relY)*W;
  } else {
    return (tx-r.left)/r.width*W;
  }
}
cv.addEventListener('touchstart',function(e){
  e.preventDefault();
  initAC();
  if(phase!=='playing'){go();return;}
  var x=getTouchX(e);
  if(x<W*.3)tDir=-1;else if(x>W*.7)tDir=1;else tJump=true;
},{passive:false});
cv.addEventListener('touchmove',function(e){
  e.preventDefault();
  var x=getTouchX(e);
  tDir=x<W*.3?-1:x>W*.7?1:0;
},{passive:false});
cv.addEventListener('touchend',function(){tDir=0;});
cv.addEventListener('click',function(){initAC();if(phase!=='playing')go();});

function go(){
  phase='playing';score=0;points=0;dist=0;speed=1.6;lives=3;fn=0;
  rNX=0;rVX=0;rJ=0;rJV=0;rGnd=true;inv=0;crash=false;cT=0;
  obs=[];spc=0;tsc=0;lastScore=0;
  whipFlag=false;rampFlag=false;trick=null;turbo=0;turboActive=0;turboFlashT=0;
  flipAngle=0;flipDir=0;flipDone=false;wheelieTime=0;wheelieLean=0;
  startMusic();
}
function jump(p){
  if(!rGnd)return;
  rJV=-(p||13);rGnd=false;
  if(p&&p>14){sndKicker();rampFlag=true;}else sndJump();
}

// ─── UPDATE ────────────────────────────────────────────────────────
function update(){
  var baseSpeed=Math.min(4.8,1.6+dist*.00028);
  speed=turboActive>0?baseSpeed*1.55:baseSpeed;
  dist+=speed;score=Math.floor(dist/10);
  points+=speed*1.4;
  tsc=(tsc+speed*2.8)%52;
  if(score>0&&score%50===0&&score!==lastScore){sndScore();lastScore=score;}

  var ax=0;
  if(keys['ArrowLeft']||keys['KeyA'])ax=-1;
  if(keys['ArrowRight']||keys['KeyD'])ax=1;
  if(tDir)ax=tDir;
  if((keys['Space']||tJump)&&rGnd)jump();
  tJump=false;

  // Frontflip: UP en el aire
  if(keys['ArrowUp']&&rGnd)jump();
  if(keys['ArrowUp']&&!rGnd&&flipDir===0){flipDir=1;}
  // Backflip / Wheelie: DOWN
  if(keys['ArrowDown']&&rGnd){
    wheelieTime++;
    wheelieLean=Math.min(0.45, wheelieTime*0.018);
  } else {
    if(wheelieTime>30&&wheelieLean>0.1&&rGnd){
      var wt=Math.round(wheelieTime/6);
      trick={label:'WHEELIE',pts:wt*5,timer:70};
      points+=wt*5;turbo=Math.min(100,turbo+10);sndTrick();
    }
    wheelieTime=0; wheelieLean*=0.82;
  }
  if(keys['ArrowDown']&&!rGnd&&flipDir===0){flipDir=-1;}

  // Ejecutar flip en el aire
  if(!rGnd&&flipDir!==0){
    flipAngle+=flipDir*0.13;
    if(!flipDone&&Math.abs(flipAngle)>=Math.PI*2){
      flipDone=true;
      var flipLabel=flipDir>0?'FRONTFLIP':'BACKFLIP';
      var flipBonus=flipDir>0?350:400;
      trick={label:flipLabel,pts:flipBonus,timer:80};
      points+=flipBonus;turbo=Math.min(100,turbo+30);sndTrick();
    }
  }

  if(!rGnd&&ax!==0)whipFlag=true;

  rVX+=ax*.075;rVX*=.80;
  rNX+=rVX*.042;rNX=Math.max(-.88,Math.min(.88,rNX));
  CAMX=W/2-rNX*120;

  if(!rGnd){
    rJV+=.85;rJ+=rJV;
    if(rJ>=0){
      rJ=0;rJV=0;rGnd=true;
      sndLand();
      // Reset flip
      var landed=flipDone;
      if(!landed&&Math.abs(flipAngle)>0.5){
        // aterrizó a mitad de flip — crash
        if(inv<=0){lives--;sndCrash();crash=true;cT=40;inv=110;rJV=-9;rGnd=false;
          if(lives<=0)setTimeout(function(){if(score>best)best=score;phase='gameover';stopMusic();},800);}
      }
      flipAngle=0;flipDir=0;flipDone=false;
      var label=null,bonus=0;
      if(whipFlag&&rampFlag){label='WHIP+AIR';bonus=300;}
      else if(rampFlag){label='BIG AIR';bonus=150;}
      else if(whipFlag){label='WHIP';bonus=250;}
      if(label&&!landed){
        points+=bonus;
        turbo=Math.min(100,turbo+(rampFlag?12:20));
        trick={label:label,pts:bonus,timer:75};
        sndTrick();
      }
      whipFlag=false;rampFlag=false;
    }
  }

  if(turbo>=100&&turboActive<=0){
    turbo=0;turboActive=95;turboFlashT=40;sndTurbo();
  }
  if(turboActive>0)turboActive--;
  if(turboFlashT>0)turboFlashT--;
  if(trick&&--trick.timer<=0)trick=null;

  spc--;
  if(spc<=0){
    var r=Math.random(),t=r<.35?'stone':r<.6?'curb':r<.8?'pole':'ramp';
    var nx=Math.max(-.75,Math.min(.75,(Math.random()-.5)*1.4));
    obs.push({t:t,nx:nx,z:0,hit:false,used:false});
    spc=Math.max(22,58-dist*.015)+(Math.random()*28|0);
  }

  var dz=speed*.011;
  for(var i=obs.length-1;i>=0;i--){
    var o=obs[i];o.z+=dz;
    if(o.t==='ramp'&&!o.used&&o.z>.90&&o.z<1.06&&Math.abs(rNX-o.nx)<.22&&rGnd){o.used=true;jump(18);}
    if(!o.hit&&o.t!=='ramp'&&inv<=0&&o.z>.87&&o.z<1.06){
      var dx=Math.abs(rNX-o.nx),hw=o.t==='pole'?.17:.14;
      if(dx<hw&&!((o.t==='stone'||o.t==='curb')&&rJ<-16)){
        o.hit=true;crash=true;cT=40;inv=110;rJV=-9;rGnd=false;
        whipFlag=false;rampFlag=false;
        sndCrash();
        lives--;
        if(lives<=0)setTimeout(function(){if(score>best)best=score;phase='gameover';stopMusic();},800);
      }
    }
    if(o.z>1.25)obs.splice(i,1);
  }
  if(inv>0)inv--;
  if(crash&&--cT<=0)crash=false;
}

// ─── HELPERS (genéricos, sirven para cx o mctx) ─────────────────────
function pillC(c,x,y,w,h,r){
  c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.arcTo(x+w,y,x+w,y+r,r);
  c.lineTo(x+w,y+h-r);c.arcTo(x+w,y+h,x+w-r,y+h,r);
  c.lineTo(x+r,y+h);c.arcTo(x,y+h,x,y+h-r,r);
  c.lineTo(x,y+r);c.arcTo(x,y,x+r,y,r);c.closePath();
}
// Panel tipo madera — fondo con veta sutil, para HUD con carácter rider/outdoor
function woodPanel(c,x,y,w,h,r){
  pillC(c,x,y,w,h,r);
  var g=c.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,'rgba(58,42,26,.82)');
  g.addColorStop(1,'rgba(38,26,16,.82)');
  c.fillStyle=g;c.fill();
  c.save();pillC(c,x,y,w,h,r);c.clip();
  c.strokeStyle='rgba(0,0,0,.18)';c.lineWidth=1;
  for(var gy=y+4;gy<y+h;gy+=5){
    c.beginPath();
    c.moveTo(x,gy+Math.sin(gy*.7)*1.5);
    c.bezierCurveTo(x+w*.3,gy+Math.sin(gy*.5)*2,x+w*.7,gy+Math.sin(gy*.9)*2,x+w,gy+Math.sin(gy*.6)*1.5);
    c.stroke();
  }
  c.restore();
  c.strokeStyle='rgba(168,114,74,.3)';c.lineWidth=1.5;
  pillC(c,x,y,w,h,r);c.stroke();
}
function heartC(c,x,y,s,filled){
  c.save();c.translate(x,y);c.scale(s,s);
  c.fillStyle=filled?'#9a3a2a':'#2e2218';
  c.beginPath();
  c.moveTo(0,3);
  c.bezierCurveTo(-7,-4,-7,-9,-2,-9);
  c.bezierCurveTo(0,-9,0,-6,0,-5);
  c.bezierCurveTo(0,-6,0,-9,2,-9);
  c.bezierCurveTo(7,-9,7,-4,0,3);
  c.closePath();c.fill();
  if(filled){c.fillStyle='rgba(255,255,255,.4)';c.beginPath();c.ellipse(-2,-6,1.4,1,0,0,Math.PI*2);c.fill();}
  c.restore();
}
function strokeText(c,txt,x,y,fill,strokeCol,lw){
  c.lineWidth=lw||4;c.strokeStyle=strokeCol||'rgba(0,0,0,.65)';c.lineJoin='round';
  c.strokeText(txt,x,y);
  c.fillStyle=fill;c.fillText(txt,x,y);
}

// ─── ESCENA (pixel-art, baja resolución) ───────────────────────────
function sky(){
  // Cielo brillante tipo Sled Surfers
  var g=cx.createLinearGradient(0,0,0,HY+30);
  g.addColorStop(0,'#5ab8e8');
  g.addColorStop(.55,'#8ed4f0');
  g.addColorStop(.85,'#c8ecf8');
  g.addColorStop(1,'#d4f0e8');
  cx.fillStyle=g;cx.fillRect(0,0,W,HY+30);
  // Sol brillante
  var sg=cx.createRadialGradient(W*.72,HY*.38,0,W*.72,HY*.38,38);
  sg.addColorStop(0,'#fff7aa');sg.addColorStop(.5,'#ffe066');sg.addColorStop(1,'rgba(255,200,0,0)');
  cx.fillStyle=sg;cx.beginPath();cx.arc(W*.72,HY*.38,38,0,Math.PI*2);cx.fill();
  // Nubes simples
  [W*.18,W*.45,W*.82].forEach(function(cx2,i){
    var cy2=HY*.22+i*12;var wr=[55,42,50][i];
    cx.fillStyle='rgba(255,255,255,.85)';
    cx.beginPath();cx.ellipse(cx2,cy2,wr,18,0,0,Math.PI*2);cx.fill();
    cx.beginPath();cx.ellipse(cx2-22,cy2+6,28,14,0,0,Math.PI*2);cx.fill();
    cx.beginPath();cx.ellipse(cx2+20,cy2+8,24,12,0,0,Math.PI*2);cx.fill();
  });
  // Franja de horizonte
  cx.fillStyle='#b8dfc8';cx.fillRect(0,HY-4,W,8);
}
function mountains(){
  // Bosque del horizonte — verde vivo con brillo
  cx.beginPath();cx.moveTo(0,HY+10);
  for(var i=0;i<hills.length;i++)cx.lineTo(i*18,hills[i]);
  cx.lineTo(W,HY+10);cx.closePath();cx.fillStyle='#2a7a3a';cx.fill();
  // Segunda capa más oscura para profundidad
  cx.beginPath();cx.moveTo(0,HY+10);
  for(var i=0;i<hills.length;i++)cx.lineTo(i*18,hills[i]+22+Math.sin(i*.4)*8);
  cx.lineTo(W,HY+10);cx.closePath();cx.fillStyle='#1e5e2a';cx.fill();
  // Silueta de pinos en el horizonte
  for(var k=0;k<28;k++){
    var hx=(k*51+tsc)%W, hi2=Math.floor(hx/18)%hills.length;
    var hy2=hills[Math.min(hi2,hills.length-1)];
    var hs=4+((k*7)%6);
    cx.fillStyle=k%3===0?'#1a4a22':'#1e6030';
    cx.beginPath();cx.moveTo(hx,hy2-hs*5);cx.lineTo(hx+hs*2,hy2);cx.lineTo(hx-hs*2,hy2);cx.closePath();cx.fill();
  }
}
function trail(){
  // Prado lateral verde vivo
  cx.fillStyle='#4aaa5a';cx.fillRect(0,HY,W,H-HY);
  // Sombra bajo pista
  var sg2=cx.createLinearGradient(0,HY,0,HY+40);
  sg2.addColorStop(0,'rgba(0,0,0,.18)');sg2.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle=sg2;cx.fillRect(0,HY,W,40);
  // Superficie de pista — gris piedra limpio y brillante
  cx.beginPath();cx.moveTo(tL(0),HY);cx.lineTo(tR(0),HY);cx.lineTo(tR(1),H);cx.lineTo(tL(1),H);cx.closePath();
  var tg=cx.createLinearGradient(0,HY,0,H);
  tg.addColorStop(0,'#b8b8c0');tg.addColorStop(.4,'#c8c8cc');tg.addColorStop(1,'#d4d4d8');
  cx.fillStyle=tg;cx.fill();
  // Brillo central
  cx.beginPath();cx.moveTo(wX(-.12,0),HY);cx.lineTo(wX(.12,0),HY);cx.lineTo(wX(.25,1),H);cx.lineTo(wX(-.25,1),H);cx.closePath();
  cx.fillStyle='rgba(255,255,255,.18)';cx.fill();
  for(var i=0;i<14;i++){
    var z0=(i+tsc/52)/14,z1=(i+1+tsc/52)/14;
    if(z0>1||z1<0)continue;
    var zc=Math.min(1,(z0+z1)*.5);
    cx.beginPath();
    cx.moveTo(wX(-1,z0),wY(z0));cx.lineTo(wX(1,z0),wY(z0));
    cx.lineTo(wX(1,Math.min(z1,1)),wY(Math.min(z1,1)));
    cx.lineTo(wX(-1,Math.min(z1,1)),wY(Math.min(z1,1)));
    cx.closePath();
    cx.strokeStyle='rgba(180,180,188,'+(.25+zc*.2)+')';
    cx.lineWidth=Math.max(1,2.5*sc(zc));cx.stroke();
  }
  for(var c=-3;c<=3;c++){
    if(c===0)continue;
    cx.beginPath();cx.moveTo(wX(c*.16,0),wY(0));cx.lineTo(wX(c*.16,1),wY(1));
    cx.strokeStyle='rgba(35,28,38,.18)';cx.lineWidth=1;cx.stroke();

function pineTree(x,y,s){
  var h=160*s,w=52*s;
  cx.fillStyle='rgba(0,0,0,.22)';cx.beginPath();cx.ellipse(x,y+2*s,w*.4,3*s,0,0,Math.PI*2);cx.fill();
  // Tronco
  cx.fillStyle='#4a3018';cx.fillRect(x-4*s,y-h*.26,8*s,h*.30);
  // Copas — verde de bosque vívido, nítido (no apagado)
  var cols=['#1a8a2e','#2aaa3e','#3acc4e'];
  for(var L=0;L<3;L++){
    var ly=y-h*.18-L*h*.26,lw=w*(1-L*.20);
    cx.fillStyle=cols[L];
    cx.beginPath();
    cx.moveTo(x,ly-h*.30);
    cx.lineTo(x+lw/2,ly);cx.lineTo(x+lw*.18,ly);
    cx.lineTo(x+lw*.4,ly+h*.06);
    cx.lineTo(x-lw*.4,ly+h*.06);
    cx.lineTo(x-lw*.18,ly);cx.lineTo(x-lw/2,ly);
    cx.closePath();cx.fill();
    // Highlight de luz lateral
    cx.fillStyle='rgba(255,255,255,.10)';
    cx.beginPath();cx.moveTo(x,ly-h*.30);cx.lineTo(x+lw*.12,ly);cx.lineTo(x,ly);cx.closePath();cx.fill();
  }
}
function trailRock(x,y,s){

  cx.lineTo(x+sc2*.35,y-sc2*.78);cx.lineTo(x+sc2*.92,y-sc2*.2);cx.lineTo(x+sc2,y);

function critter(x,y,s,kind){

function roadside(){
  var pattern=['pine','pine','rock','pine','critter','rock','pine','critter','pine'];
  for(var i=0;i<9;i++){
    var z=((i/9)+tsc/52*.45)%1,s=sc(z),sy=wY(z);
    var t=pattern[i%pattern.length];
    var lx=tL(z)-22*s, rx=tR(z)+22*s;
    if(t==='pine'){pineTree(lx,sy,s);pineTree(rx,sy,s*.92);}
    else if(t==='rock'){trailRock(lx,sy,s);trailRock(rx,sy,s*.9);}
    else {critter(lx,sy,s,i%2);critter(rx,sy,s*.9,(i+1)%2);}
  }
}

function drawRider(){

  var rz=0.82;             // posición en profundidad de la pista (0=horizonte, 1=borde inferior)
  var sx=wX(rNX,rz);

  cx.fillStyle='rgba(0,0,0,'+(rJ<-5?Math.max(0,.22-(-rJ)*.003):.22)+')';

  cx.save();
  cx.translate(sx,sy);
  cx.scale(rs,rs);

  // Lean lateral con el giro
  cx.rotate(rVX*14*Math.PI/180);

  if(Math.abs(flipAngle)>0.01) cx.rotate(-flipAngle);

  var steer=rVX*.16;

  var WCY=20,WRX=12,WRY=19;
  cx.fillStyle='#111';cx.beginPath();cx.ellipse(0,WCY,WRX,WRY,0,0,Math.PI*2);cx.fill();

  cx.fillStyle='#555';cx.beginPath();cx.arc(0,WCY,2,0,Math.PI*2);cx.fill();

  // ── CUADRO (seat stays forman V visible → confirma rueda vertical) ──
  cx.strokeStyle='#a8472a';cx.lineWidth=3;cx.lineCap='round';

  cx.beginPath();cx.moveTo(2,WCY-3);cx.lineTo(8,-16);cx.stroke();

  cx.beginPath();cx.moveTo(-8,-16);cx.lineTo(8,-16);cx.stroke();

  cx.beginPath();cx.moveTo(0,-16);cx.lineTo(0,-5);cx.stroke();

  // ── RUEDA DELANTERA (más alta que ancha, gira con steer) ──

  var fRX=WRX*.52;
  cx.fillStyle='#0f0f0f';cx.beginPath();cx.ellipse(0,-26,fRX,fRY,steer,0,Math.PI*2);cx.fill();
  cx.strokeStyle='#333';cx.lineWidth=3;cx.beginPath();cx.ellipse(0,-26,fRX,fRY,steer,0,Math.PI*2);cx.stroke();
  cx.strokeStyle='#555';cx.lineWidth=1.5;cx.beginPath();cx.ellipse(0,-26,fRX-3,fRY-3,steer,0,Math.PI*2);cx.stroke();
  // Fork

  mctx.fillText(turboActive>0?'⚡':Math.round(turbo)+'%',pX+pW-10,pY+38);
  mctx.textAlign='left';
  mctx.fillStyle='rgba(0,0,0,.35)';pillC(mctx,pX+10,pY+43,pW-20,8,4);mctx.fill();
  mctx.fillStyle=turboActive>0?'#fff':'#f0a020';pillC(mctx,pX+10,pY+43,Math.max(4,(pW-20)*(turbo/100)),8,4);mctx.fill();

  // Popup de truco
  if(trick&&trick.timer>0){
    var a=Math.min(1,trick.timer/20);
    mctx.globalAlpha=a;
    woodPanel(mctx,W/2-100,84,200,58,10);
    mctx.fillStyle='rgba(154,230,42,.5)';pillC(mctx,W/2-100,84,200,4,2);mctx.fill();
    mctx.textAlign='center';
    mctx.font='bold 11px Arial';mctx.fillStyle='#c89a3a';
    mctx.fillText('¡TRUCO!',W/2,103);
    mctx.font='bold 22px Impact,Arial Black,sans-serif';
    strokeText(mctx,trick.label,W/2,128,'#fff','rgba(0,0,0,.5)',3);
    mctx.font='bold 13px Arial';mctx.fillStyle='#4ab840';
    mctx.fillText('+'+trick.pts+' PTS',W/2,141);
    mctx.globalAlpha=1;mctx.textAlign='left';
  }
  if(turboFlashT>0){
    mctx.globalAlpha=Math.min(1,turboFlashT/20);
    mctx.textAlign='center';mctx.font='bold 42px Impact,Arial Black,sans-serif';
    strokeText(mctx,'¡TURBO!',W/2,H/2-30,'#f0a020','rgba(0,0,0,.5)',6);
    mctx.globalAlpha=1;mctx.textAlign='left';
  }
}

// ─── PANTALLAS ──────────────────────────────────────────────────────

  mctx.fillStyle='rgba(18,12,7,.80)';mctx.fillRect(0,0,W,H);
  logoCrisp(W/2-150,H/2-150,1.3,true);

  mctx.textAlign='center';
  mctx.font='bold 46px Impact,Arial Black,sans-serif';
  strokeText(mctx,'CERRO ABAJO',W/2,H/2-22,'#a8472a','rgba(0,0,0,.6)',6);
  mctx.font='bold 20px Impact,Arial Black,sans-serif';
  strokeText(mctx,'ARCADE',W/2,H/2+8,'#4ab840','rgba(0,0,0,.6)',4);

  woodPanel(mctx,W/2-180,H/2+28,360,76,12);
  mctx.font='bold 13px Arial';mctx.fillStyle='#eee';
  mctx.fillText('← →  GIRAR      ↑  SALTAR / FRONTFLIP',W/2,H/2+54);
  mctx.font='12px Arial';mctx.fillStyle='#4ab840';
  mctx.fillText('↓ en tierra = WHEELIE  ·  ↓ en aire = BACKFLIP',W/2,H/2+74);
  mctx.font='11px Arial';mctx.fillStyle='rgba(255,255,255,.6)';
  mctx.fillText('ACUMULA TRUCOS PARA LLENAR EL TURBO',W/2,H/2+92);

  if(fn%50<32){
    mctx.fillStyle='#fff';mctx.font='bold 16px Impact,Arial Black,sans-serif';
    strokeText(mctx,'▶  TOCA PARA INICIAR',W/2,H/2+128,'#fff','rgba(224,85,16,.9)',5);
  }
  mctx.font='10px Arial';mctx.fillStyle='rgba(255,255,255,.35)';
  mctx.fillText('VALPARAÍSO CERRO ABAJO · STAGE CRONO ARCADE',W/2,H-14);
  mctx.textAlign='left';
}
function gameover(){
  mctx.fillStyle='rgba(18,12,7,.86)';mctx.fillRect(0,0,W,H);
  mctx.textAlign='center';
  mctx.font='bold 38px Impact,Arial Black,sans-serif';
  strokeText(mctx,'¡ CAÍDA !',W/2,H/2-78,'#a8472a','rgba(0,0,0,.6)',6);

  woodPanel(mctx,W/2-140,H/2-54,280,100,10);
  mctx.font='bold 15px Arial';mctx.fillStyle='#fff';
  mctx.fillText('PUNTOS: '+Math.floor(points).toLocaleString('es-CL'),W/2,H/2-22);
  mctx.font='12px Arial';mctx.fillStyle='#ccc';
  mctx.fillText('KM RECORRIDOS: '+score,W/2,H/2);
  if(score>0&&score===best){
    mctx.font='bold 13px Arial';mctx.fillStyle='#4ab840';
    mctx.fillText('★  NUEVO RECORD  ★',W/2,H/2+22);
  }else{
    mctx.font='11px Arial';mctx.fillStyle='#888';
    mctx.fillText('RECORD: '+best+' KM',W/2,H/2+22);
  }
  if(fn%50<32){
    mctx.font='bold 14px Impact,Arial Black,sans-serif';
    strokeText(mctx,'▶  TOCA PARA REINTENTAR',W/2,H/2+62,'#fff','rgba(224,85,16,.9)',5);
  }
  mctx.textAlign='left';
}

// ─── LOOP ──────────────────────────────────────────────────────────
function loop(){
  requestAnimationFrame(loop);
  try{
    fn++;
    cx.save();
    cx.setTransform(OW/W,0,0,OH/H,0,0);
    cx.clearRect(0,0,W,H);
    sky();mountains();trail();roadside();groundShadow();obstacles();drawRider();
    cx.restore();

    mctx.imageSmoothingEnabled=false;
    mctx.clearRect(0,0,800,450);
    mctx.drawImage(oc,0,0,OW,OH,0,0,800,450);
    mctx.imageSmoothingEnabled=true;

    if(phase==='playing'){update();hud();}
    else if(phase==='menu'){menu();}
    else if(phase==='gameover'){hud();gameover();}
  }catch(e){console.error('ERR:',e);}
}
function resize(){
  var vw=window.innerWidth, vh=window.innerHeight;
  var portrait=vw<vh;
  var s,tx=0,ty=0;
  if(portrait){
    s=Math.min(vw/450, vh/800);
    tx=(vw-450*s)/2;ty=(vh-800*s)/2;
    cv.style.transform='translate('+tx+'px,'+ty+'px) rotate(-90deg) scale('+s+')';
    cv.style.transformOrigin='225px 400px';
    cv._portrait=true;
  } else {
    s=Math.min(vw/800, vh/450);
    cv.style.transform='scale('+s+')';
    cv.style.transformOrigin='center center';
    cv._portrait=false;
  }
  cv._scale=s;cv._portrait=portrait;
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,200);});
resize();
loop();
</script>
