<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Trail Ripper — Valpo POV Clean Arcade</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#08090d;display:flex;align-items:center;justify-content:center;font-family:Arial,Helvetica,sans-serif}
  canvas{width:1280px;height:720px;max-width:100vw;max-height:100vh;background:#87c8ff;image-rendering:auto}
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const keys = {};
  addEventListener('keydown', e => { keys[e.code]=true; if(['Space','ArrowLeft','ArrowRight','KeyA','KeyD','KeyR'].includes(e.code)) e.preventDefault(); });
  addEventListener('keyup', e => keys[e.code]=false);

  const state = {
    gameOver:false,t:0,timeLeft:90,score:0,lives:3,speed:58,
    playerX:0,jump:0,jumpVel:0,airborne:false,trick:null,trickTimer:0,
    shake:0,inv:0,lastSpawn:0,obstacles:[]
  };

  function reset(){
    Object.assign(state,{gameOver:false,t:0,timeLeft:90,score:0,lives:3,speed:58,playerX:0,jump:0,jumpVel:0,airborne:false,trick:null,trickTimer:0,shake:0,inv:0,lastSpawn:0,obstacles:[]});
  }

  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function roadCurve(z){ return Math.sin(z*0.72)*0.42 + Math.sin(z*1.45+1.7)*0.18; }
  function hill(z){ return Math.sin(z*1.1)*34 + Math.sin(z*2.4+1)*14; }

  function project(x,z){
    const p = Math.pow(1-z, 2.15);
    const horizon = 248;
    const y = horizon + p*(H-horizon+90) + hill(state.t*0.003+z)*p;
    const center = W/2 + roadCurve(state.t*0.004+z*3.2)*(1-z)*500;
    const width = 110 + p*1120;
    return { x:center + x*width*0.5, y, width, p, center };
  }

  function spawn(){
    const types = ['ramp','barrel','rock','stair','hay'];
    const type = types[Math.floor(Math.random()*types.length)];
    const lane = [-0.55,0,0.55][Math.floor(Math.random()*3)];
    state.obstacles.push({ type, lane, z:1.05, hit:false });
  }

  function showTrick(txt){ state.trick = txt; state.trickTimer = 90; }

  function hitObstacle(o){
    if(state.inv>0 || o.hit) return;
    const dx = Math.abs(state.playerX - o.lane);
    const isRamp = o.type === 'ramp';

    if(isRamp){
      if(dx < 0.36 && !state.airborne){
        state.airborne = true;
        state.jumpVel = 18;
        state.jump = 1;
        state.score += 100;
        showTrick('SALTO +100');
      }
      return;
    }

    if(dx < 0.33 && state.jump < 12){
      o.hit = true;
      state.lives--;
      state.speed = Math.max(36, state.speed-10);
      state.shake = 18;
      state.inv = 70;
      showTrick('GOLPE');

      if(state.lives <= 0) state.gameOver = true;
    }
  }

  function update(){
    if(state.gameOver){
      if(keys.KeyR) reset();
      return;
    }

    state.t++;
    state.timeLeft -= 1/60;

    if(state.timeLeft <= 0) state.gameOver = true;

    const steer = (keys.ArrowRight||keys.KeyD?1:0) - (keys.ArrowLeft||keys.KeyA?1:0);
    state.playerX = clamp(state.playerX + steer*0.035, -0.98, 0.98);

    if(Math.abs(state.playerX)>0.88){
      state.speed = Math.max(42, state.speed-0.04);
      if(state.t%45===0 && state.inv<=0){
        state.lives--;
        state.shake=10;
        state.inv=60;
        showTrick('FUERA DE LINEA');
        if(state.lives<=0) state.gameOver=true;
      }
    } else {
      state.speed = Math.min(72, state.speed+0.015);
    }

    if(keys.Space && !state.airborne){
      state.airborne=true;
      state.jumpVel=17;
      state.jump=1;
    }

    if(state.airborne){
      state.jump += state.jumpVel;
      state.jumpVel -= 1.05;

      if(keys.KeyA && state.jump > 10 && state.jumpVel > -8){
        state.score += 15;
        showTrick('BACKFLIP +15');
      }

      if(keys.KeyD && state.jump > 10 && state.jumpVel > -8){
        state.score += 10;
        showTrick('WHIP +10');
      }

      if(state.jump <= 0){
        state.jump=0;
        state.airborne=false;
        state.jumpVel=0;
      }
    }

    if(state.t - state.lastSpawn > 80 + Math.random()*45){
      spawn();
      state.lastSpawn = state.t;
    }

    for(const o of state.obstacles){
      o.z -= state.speed * 0.00038;
      if(o.z < 0.15 && o.z > 0.02) hitObstacle(o);
    }

    state.obstacles = state.obstacles.filter(o => o.z > -0.08);
    state.score += Math.floor(state.speed/25);
    state.inv = Math.max(0,state.inv-1);
    state.shake = Math.max(0,state.shake-1);
    state.trickTimer = Math.max(0,state.trickTimer-1);
  }

  function poly(points, fill, stroke){
    ctx.beginPath();
    ctx.moveTo(points[0].x,points[0].y);
    for(let i=1;i<points.length;i++) ctx.lineTo(points[i].x,points[i].y);
    ctx.closePath();
    ctx.fillStyle=fill;
    ctx.fill();

    if(stroke){
      ctx.strokeStyle=stroke;
      ctx.lineWidth=2;
      ctx.stroke();
    }
  }

  function drawSky(){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#63b7f4');
    g.addColorStop(0.45,'#b9e5ff');
    g.addColorStop(1,'#f2d6a4');
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle='#2d83b8';
    ctx.fillRect(0,220,W,85);

    ctx.fillStyle='rgba(255,255,255,.75)';
    for(let i=0;i<9;i++){
      const x=(i*173+state.t*.18)%1350-60;
      ctx.fillRect(x,80+(i%3)*35,72,11);
      ctx.fillRect(x+18,70+(i%3)*35,38,12);
    }

    for(let i=0;i<110;i++){
      const x=(i*47)%W, y=245+((i*31)%130);
      ctx.fillStyle=['#d97454','#f3c264','#5798ba','#c28e6a','#9cc77b'][i%5];
      ctx.fillRect(x,y,34,24+((i*17)%22));
    }
  }

  function drawRoad(){
    for(let i=28;i>=0;i--){
      const z1=i/29, z2=(i+1)/29;
      const a=project(-1,z1), b=project(1,z1), c=project(1,z2), d=project(-1,z2);
      const shade = i%2 ? '#8d877b' : '#9b9487';

      poly([a,b,c,d], shade, null);

      const l1=project(-1.08,z1), l2=project(-1.08,z2), r1=project(1.08,z1), r2=project(1.08,z2);
      ctx.strokeStyle = i%2 ? '#d9d1bd':'#b75b4f';
      ctx.lineWidth = Math.max(2, a.p*10);

      ctx.beginPath();
      ctx.moveTo(l1.x,l1.y);
      ctx.lineTo(l2.x,l2.y);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(r1.x,r1.y);
      ctx.lineTo(r2.x,r2.y);
      ctx.stroke();

      const m1=project(0,z1), m2=project(0,z2);

      if(i%4<2){
        ctx.strokeStyle='#f8d75a';
        ctx.lineWidth=Math.max(1,a.p*5);
        ctx.beginPath();
        ctx.moveTo(m1.x,m1.y);
        ctx.lineTo(m2.x,m2.y);
        ctx.stroke();
      }
    }

    for(let side of [-1,1]){
      for(let j=0;j<7;j++){
        const z=.18+j*.11, p=project(side*1.23,z), s=p.p;
        ctx.fillStyle=['#224d66','#b95c4e','#e0b45c','#7ca36d'][j%4];
        ctx.fillRect(p.x-side*s*60,p.y-s*230,s*115,s*170);
        ctx.fillStyle='rgba(20,20,25,.25)';
        ctx.fillRect(p.x-side*s*50,p.y-s*205,s*28,s*40);
      }
    }
  }

  function drawObstacle(o){
    const p = project(o.lane, o.z);
    const s = p.p;
    if(s <= 0) return;

    ctx.save();
    ctx.translate(p.x, p.y - state.jump*0.05*s);
    ctx.scale(s,s);

    if(o.hit) ctx.globalAlpha=.35;

    if(o.type==='ramp'){
      ctx.fillStyle='#4f90a8';
      ctx.fillRect(-70,-22,140,44);
      ctx.fillStyle='#2d5f75';
      ctx.beginPath();
      ctx.moveTo(-70,22);
      ctx.lineTo(70,22);
      ctx.lineTo(45,-22);
      ctx.lineTo(-70,-22);
      ctx.fill();
    } else if(o.type==='barrel'){
      ctx.fillStyle='#a24c32';
      ctx.fillRect(-32,-82,64,82);
      ctx.fillStyle='#5d2b21';
      ctx.fillRect(-38,-88,76,12);
    } else if(o.type==='rock'){
      ctx.fillStyle='#504c47';
      ctx.beginPath();
      ctx.ellipse(0,-32,55,34,0,0,Math.PI*2);
      ctx.fill();
    } else if(o.type==='stair'){
      ctx.fillStyle='#c5b99b';
      for(let i=0;i<4;i++) ctx.fillRect(-70+i*8,-18-i*18,140-i*16,16);
    } else {
      ctx.fillStyle='#b99a4e';
      ctx.fillRect(-55,-58,110,58);
      ctx.strokeStyle='#6f5a2c';
      ctx.lineWidth=6;
      ctx.strokeRect(-55,-58,110,58);
    }

    ctx.restore();
  }

  function drawBike(){
    const jump = state.jump;
    const bob = Math.sin(state.t*.18)*2 - jump*.25;

    ctx.save();
    ctx.translate(0,bob);

    ctx.strokeStyle='#111';
    ctx.lineCap='round';
    ctx.lineWidth=18;
    ctx.beginPath();
    ctx.moveTo(330,610);
    ctx.quadraticCurveTo(W/2,575,950,610);
    ctx.stroke();

    ctx.lineWidth=8;
    ctx.beginPath();
    ctx.moveTo(W/2,595);
    ctx.lineTo(W/2,690);
    ctx.stroke();

    ctx.fillStyle='#222';
    ctx.fillRect(W/2-55,595,110,32);

    ctx.fillStyle='#1b77bd';
    ctx.fillRect(W/2-35,625,70,92);

    ctx.fillStyle='#c0814b';
    ctx.fillRect(0,590,330,75);
    ctx.fillRect(950,590,330,75);

    ctx.fillStyle='#1352a0';
    ctx.fillRect(265,565,90,70);
    ctx.fillRect(925,565,90,70);

    ctx.restore();
  }

  function box(x,y,w,h,title,value){
    ctx.fillStyle='rgba(0,0,0,.78)';
    ctx.fillRect(x,y,w,h);

    ctx.strokeStyle='#d8aa35';
    ctx.lineWidth=3;
    ctx.strokeRect(x+2,y+2,w-4,h-4);

    ctx.fillStyle='#f5bd30';
    ctx.font='bold 24px Arial';
    ctx.textAlign='center';
    ctx.fillText(title,x+w/2,y+30);

    ctx.fillStyle='#fff';
    ctx.font='bold 42px Arial';
    ctx.fillText(value,x+w/2,y+h-22);
  }

  function drawHUD(){
    box(28,24,205,92,'TIEMPO',Math.max(0,state.timeLeft).toFixed(1));

    ctx.fillStyle='rgba(0,0,0,.72)';
    ctx.fillRect(W/2-120,22,240,88);

    ctx.strokeStyle='#d8aa35';
    ctx.lineWidth=3;
    ctx.strokeRect(W/2-118,24,236,84);

    ctx.textAlign='center';
    ctx.fillStyle='#f5bd30';
    ctx.font='bold 25px Arial';
    ctx.fillText('PUNTOS',W/2,54);

    ctx.fillStyle='#fff';
    ctx.font='bold 46px Arial';
    ctx.fillText(String(state.score),W/2,98);

    box(W-220,24,190,92,'STAGE','1/5');

    ctx.fillStyle='rgba(0,0,0,.7)';
    ctx.fillRect(28,H-88,160,56);

    ctx.fillStyle='#f5bd30';
    ctx.font='bold 21px Arial';
    ctx.textAlign='left';
    ctx.fillText('VIDAS',48,H-58);

    for(let i=0;i<3;i++){
      ctx.fillStyle=i<state.lives?'#e22129':'#3b3b3b';
      ctx.beginPath();
      ctx.arc(62+i*38,H-36,14,0,Math.PI*2);
      ctx.fill();
    }

    ctx.fillStyle='rgba(0,0,0,.72)';
    ctx.fillRect(W-220,H-96,190,64);

    ctx.fillStyle='#f5bd30';
    ctx.font='bold 21px Arial';
    ctx.fillText('VELOCIDAD',W-202,H-67);

    ctx.fillStyle='#fff';
    ctx.font='bold 34px Arial';
    ctx.fillText(Math.round(state.speed)+' KM/H',W-202,H-35);

    if(state.trickTimer>0 && state.trick){
      ctx.fillStyle='rgba(0,0,0,.72)';
      ctx.fillRect(42,140,230,76);

      ctx.fillStyle='#f5bd30';
      ctx.font='bold 24px Arial';
      ctx.fillText('TRUCO',64,170);

      ctx.fillStyle='#fff';
      ctx.font='bold 28px Arial';
      ctx.fillText(state.trick,64,202);
    }

    ctx.fillStyle='rgba(0,0,0,.72)';
    ctx.fillRect(0,H-28,W,28);

    ctx.fillStyle='#fff';
    ctx.font='bold 20px Arial';
    ctx.textAlign='left';
    ctx.fillText('VALPARAISO CERRO ABAJO — STAGE CRONO ARCADE',24,H-8);
  }

  function drawGameOver(){
    ctx.fillStyle='rgba(0,0,0,.78)';
    ctx.fillRect(0,0,W,H);

    ctx.textAlign='center';
    ctx.fillStyle='#f5bd30';
    ctx.font='bold 64px Arial';
    ctx.fillText('GAME OVER',W/2,H/2-40);

    ctx.fillStyle='#fff';
    ctx.font='bold 28px Arial';
    ctx.fillText('Puntos: '+state.score,W/2,H/2+10);

    ctx.font='22px Arial';
    ctx.fillText('Presiona R para reiniciar',W/2,H/2+55);
  }

  function draw(){
    const sx = state.shake ? (Math.random()-.5)*state.shake : 0;
    const sy = state.shake ? (Math.random()-.5)*state.shake : 0;

    ctx.save();
    ctx.translate(sx,sy);

    drawSky();
    drawRoad();

    [...state.obstacles].sort((a,b)=>b.z-a.z).forEach(drawObstacle);

    drawBike();
    drawHUD();

    if(state.gameOver) drawGameOver();

    ctx.restore();
  }

  function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
  }

  loop();
})();
</script>
</body>
</html>
