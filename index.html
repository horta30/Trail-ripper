<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TRAIL RIPPER — Gravitas MTB</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0d0d;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }
  #wrap {
    position: relative;
    width: 400px;
    height: 600px;
    box-shadow: 0 0 60px rgba(224,85,16,0.25);
  }
  canvas {
    display: block;
    width: 400px;
    height: 600px;
    cursor: crosshair;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="400" height="600"></canvas>
</div>
<script>
// ============================================================
//  TRAIL RIPPER — MTB downhill dodger
//  Gravitas Solutions | Pablo Horta
// ============================================================
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');

const W  = 400;
const H  = 600;

// Perspective geometry
const HORIZON_Y   = H * 0.30;
const RIDER_Y_BASE = H * 0.63;
const TW_FAR      = 36;   // trail width at horizon (px)
const TW_NEAR     = 270;  // trail width at rider level (px)
const VPX         = W / 2; // vanishing point X

function trailLeft(z)  { return VPX - (TW_FAR + (TW_NEAR - TW_FAR) * z) / 2; }
function trailRight(z) { return VPX + (TW_FAR + (TW_NEAR - TW_FAR) * z) / 2; }
function worldToScreenX(nx, z) { return VPX + nx * (TW_FAR + (TW_NEAR - TW_FAR) * z) / 2; }
function worldToScreenY(z)     { return HORIZON_Y + (RIDER_Y_BASE - HORIZON_Y) * z; }
function scaleAt(z)            { return 0.10 + 0.90 * z; }

// ============================================================
//  STATE
// ============================================================
let phase = 'menu'; // menu | playing | gameover
let score, best = 0, speed, distance, lives, frameN;
let rNX, rVX, rJump, rJumpV, rOnGround, invincible, crashed, crashTimer;
let obstacles = [], spawnCooldown = 0;
let terrainScroll = 0;
const keys = {};
let touchDir = 0, tapJump = false;

// Pre-generate background mountains
const mtns = [];
for (let x = 0; x <= W; x += 18) {
  mtns.push(H * 0.17 + Math.sin(x * 0.009) * 28 + Math.sin(x * 0.025) * 14);
}

// ============================================================
//  CONTROLS
// ============================================================
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (phase === 'menu' || phase === 'gameover') startGame();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (phase !== 'playing') { startGame(); return; }
  const rect = canvas.getBoundingClientRect();
  const tx = (e.touches[0].clientX - rect.left) / rect.width * W;
  if      (tx < W * 0.3)  touchDir = -1;
  else if (tx > W * 0.7)  touchDir =  1;
  else                     tapJump  = true;
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const tx = (e.touches[0].clientX - rect.left) / rect.width * W;
  if      (tx < W * 0.3)  touchDir = -1;
  else if (tx > W * 0.7)  touchDir =  1;
  else                     touchDir =  0;
}, { passive: false });

canvas.addEventListener('touchend', () => { touchDir = 0; });
canvas.addEventListener('click', () => {
  if (phase !== 'playing') startGame();
});

// ============================================================
//  GAME INIT
// ============================================================
function startGame() {
  phase        = 'playing';
  score        = 0;
  distance     = 0;
  speed        = 1.6;
  lives        = 3;
  frameN       = 0;
  rNX          = 0;
  rVX          = 0;
  rJump        = 0;
  rJumpV       = 0;
  rOnGround    = true;
  invincible   = 0;
  crashed      = false;
  crashTimer   = 0;
  obstacles    = [];
  spawnCooldown= 0;
  terrainScroll= 0;
}

function doJump(power) {
  if (!rOnGround) return;
  rJumpV    = -(power || 13);
  rOnGround = false;
}

// ============================================================
//  SPAWN
// ============================================================
function spawn() {
  const r = Math.random();
  // rock 35% | log 25% | tree 20% | kicker 20%
  const type = r < 0.35 ? 'rock' : r < 0.60 ? 'log' : r < 0.80 ? 'tree' : 'kicker';
  const nx = (Math.random() - 0.5) * 1.4;
  obstacles.push({ type, nx: Math.max(-0.75, Math.min(0.75, nx)), z: 0, hit: false, used: false });
}

// ============================================================
//  UPDATE
// ============================================================
function update() {
  speed    = Math.min(4.8, 1.6 + distance * 0.00028);
  distance += speed;
  score    = Math.floor(distance / 10);

  terrainScroll = (terrainScroll + speed * 2.8) % 52;

  // Rider X input
  let ax = 0;
  if (keys['ArrowLeft']  || keys['KeyA']) ax = -1;
  if (keys['ArrowRight'] || keys['KeyD']) ax =  1;
  if (touchDir !== 0) ax = touchDir;
  if ((keys['Space'] || keys['ArrowUp'] || tapJump) && rOnGround) doJump();
  tapJump = false;

  rVX  += ax * 0.075;
  rVX  *= 0.80;
  rNX  += rVX * 0.042;
  rNX   = Math.max(-0.88, Math.min(0.88, rNX));

  // Jump physics
  if (!rOnGround) {
    rJumpV += 0.85;
    rJump  += rJumpV;
    if (rJump >= 0) { rJump = 0; rJumpV = 0; rOnGround = true; }
  }

  // Spawn
  spawnCooldown--;
  if (spawnCooldown <= 0) {
    spawn();
    spawnCooldown = Math.max(22, 58 - distance * 0.015) + Math.random() * 28 | 0;
  }

  // Advance obstacles
  const dz = speed * 0.011;
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.z += dz;

    // Kicker: auto-launch
    if (o.type === 'kicker' && !o.used && o.z > 0.90 && o.z < 1.06) {
      const dx = Math.abs(rNX - o.nx);
      if (dx < 0.22 && rOnGround) { o.used = true; doJump(18); }
    }

    // Collision
    if (!o.hit && o.type !== 'kicker' && invincible <= 0) {
      if (o.z > 0.87 && o.z < 1.06) {
        const dx = Math.abs(rNX - o.nx);
        const hitW = o.type === 'tree' ? 0.17 : 0.14;
        const canClear = (o.type === 'rock' || o.type === 'log') && rJump < -16;
        if (dx < hitW && !canClear) {
          o.hit      = true;
          crashed    = true;
          crashTimer = 38;
          invincible = 110;
          rJumpV     = -9;
          rOnGround  = false;
          lives--;
          if (lives <= 0) setTimeout(endGame, 700);
        }
      }
    }

    if (o.z > 1.25) obstacles.splice(i, 1);
  }

  if (invincible > 0) invincible--;
  if (crashed && --crashTimer <= 0) crashed = false;
}

function endGame() {
  if (score > best) best = score;
  phase = 'gameover';
}

// ============================================================
//  DRAW HELPERS
// ============================================================
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, HORIZON_Y + 30);
  g.addColorStop(0,   '#0c0b1a');
  g.addColorStop(0.55,'#1e3655');
  g.addColorStop(1,   '#3a6878');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, HORIZON_Y + 30);
}

function drawMountains() {
  // Far ridge
  ctx.beginPath();
  ctx.moveTo(0, HORIZON_Y + 12);
  mtns.forEach((y, i) => ctx.lineTo(i * 18, y));
  ctx.lineTo(W, HORIZON_Y + 12);
  ctx.closePath();
  ctx.fillStyle = '#132a1c';
  ctx.fill();
  // Near ridge
  ctx.beginPath();
  ctx.moveTo(0, HORIZON_Y + 12);
  mtns.forEach((y, i) => ctx.lineTo(i * 18, y + 20 + Math.sin(i * 0.4) * 8));
  ctx.lineTo(W, HORIZON_Y + 12);
  ctx.closePath();
  ctx.fillStyle = '#0e1f14';
  ctx.fill();
}

function drawTrail() {
  // Ground fill under trail
  ctx.fillStyle = '#1c3a1c';
  ctx.fillRect(0, HORIZON_Y, W, H - HORIZON_Y);

  // Trail surface
  ctx.beginPath();
  ctx.moveTo(trailLeft(0),  HORIZON_Y);
  ctx.lineTo(trailRight(0), HORIZON_Y);
  ctx.lineTo(trailRight(1), H);
  ctx.lineTo(trailLeft(1),  H);
  ctx.closePath();
  const tg = ctx.createLinearGradient(0, HORIZON_Y, 0, H);
  tg.addColorStop(0,   '#3a2510');
  tg.addColorStop(0.45,'#56361c');
  tg.addColorStop(1,   '#6b4228');
  ctx.fillStyle = tg;
  ctx.fill();

  // Scrolling speed stripes
  const nStripes = 9;
  for (let i = 0; i < nStripes; i++) {
    const z0 = ((i     + terrainScroll / 52)) / nStripes;
    const z1 = ((i + 1 + terrainScroll / 52)) / nStripes;
    if (z0 > 1 || z1 < 0) continue;
    if (i % 2 === 0) continue;
    const zc = (z0 + z1) * 0.5;
    ctx.beginPath();
    ctx.moveTo(worldToScreenX(-0.06, z0), worldToScreenY(z0));
    ctx.lineTo(worldToScreenX( 0.06, z0), worldToScreenY(z0));
    ctx.lineTo(worldToScreenX( 0.06, Math.min(z1, 1)), worldToScreenY(Math.min(z1, 1)));
    ctx.lineTo(worldToScreenX(-0.06, Math.min(z1, 1)), worldToScreenY(Math.min(z1, 1)));
    ctx.closePath();
    ctx.fillStyle = `rgba(100,65,35,${0.22 + zc * 0.28})`;
    ctx.fill();
  }

  // Trail edges
  ctx.strokeStyle = '#7a5030';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(trailLeft(0), HORIZON_Y);  ctx.lineTo(trailLeft(1),  H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(trailRight(0), HORIZON_Y); ctx.lineTo(trailRight(1), H); ctx.stroke();
}

function drawForestSides() {
  const nTrees = 7;
  for (let i = 0; i < nTrees; i++) {
    const z = ((i / nTrees) + terrainScroll / 52 * 0.45) % 1;
    const sc = scaleAt(z);
    const sy = worldToScreenY(z);
    drawPine(trailLeft(z)  - 16 * sc, sy, sc);
    drawPine(trailRight(z) + 16 * sc, sy, sc);
  }
}

function drawPine(x, y, sc) {
  const h = 85 * sc, w = 30 * sc;
  // Trunk
  ctx.fillStyle = '#2e1508';
  ctx.fillRect(x - 4*sc, y - h * 0.28, 8*sc, h * 0.32);
  // Layers
  const cols = ['#093209','#0d4a0d','#175a17'];
  for (let L = 0; L < 3; L++) {
    const ly = y - h * 0.15 - L * h * 0.24;
    const lw = w * (1 - L * 0.22);
    ctx.beginPath();
    ctx.moveTo(x,        ly - h * 0.26);
    ctx.lineTo(x + lw/2, ly);
    ctx.lineTo(x - lw/2, ly);
    ctx.closePath();
    ctx.fillStyle = cols[L];
    ctx.fill();
  }
}

// ============================================================
//  OBSTACLES
// ============================================================
function drawObstacles() {
  const sorted = obstacles.slice().sort((a, b) => a.z - b.z);
  for (const o of sorted) {
    if (o.z < 0.04) continue;
    const sc = scaleAt(o.z);
    const sx = worldToScreenX(o.nx, o.z);
    const sy = worldToScreenY(o.z);
    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(sc, sc);
    if      (o.type === 'rock')   drawRock(o.hit);
    else if (o.type === 'log')    drawLog(o.hit);
    else if (o.type === 'tree')   drawObsTree(o.hit);
    else if (o.type === 'kicker') drawKicker(o.used);
    ctx.restore();
  }
}

function drawRock(hit) {
  ctx.fillStyle = hit ? '#ff5533' : '#707070';
  ctx.beginPath();
  ctx.moveTo(-20, 2);
  ctx.lineTo(-24, -6);
  ctx.lineTo(-14, -17);
  ctx.lineTo(2,   -20);
  ctx.lineTo(18,  -11);
  ctx.lineTo(22,   2);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = hit ? '#ff8866' : '#999';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.13)';
  ctx.beginPath(); ctx.ellipse(-5, -11, 6, 3, -0.4, 0, Math.PI*2); ctx.fill();
}

function drawLog(hit) {
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(0, 3, 30, 5, 0, 0, Math.PI*2); ctx.fill();
  // Body
  ctx.fillStyle = hit ? '#ff6644' : '#7a4518';
  ctx.fillRect(-30, -12, 60, 10);
  // Top arc
  ctx.fillStyle = hit ? '#ff8855' : '#9a5a20';
  ctx.beginPath(); ctx.ellipse(0, -12, 30, 7, 0, 0, Math.PI*2); ctx.fill();
  // End caps
  ctx.fillStyle = hit ? '#cc3300' : '#5a3010';
  for (const ex of [-30, 30]) {
    ctx.beginPath(); ctx.ellipse(ex, -7, 6, 9, 0, 0, Math.PI*2); ctx.fill();
    // Rings
    ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(ex, -7, 3, 5, 0, 0, Math.PI*2); ctx.stroke();
  }
}

function drawObsTree(hit) {
  ctx.fillStyle = hit ? '#ff3322' : '#1a0a03';
  ctx.fillRect(-6, -56, 12, 56);
  const cs = hit ? ['#ff5544','#ff4433','#ff3322'] : ['#082008','#0c2e0c','#114411'];
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = cs[i];
    ctx.beginPath();
    ctx.moveTo(0,     -56 - i*14);
    ctx.lineTo( 26-i*4, -36-i*8);
    ctx.lineTo(-26+i*4, -36-i*8);
    ctx.closePath();
    ctx.fill();
  }
}

function drawKicker(used) {
  ctx.fillStyle = used ? '#88bb22' : '#cc9922';
  ctx.beginPath();
  ctx.moveTo(-28,  2);
  ctx.lineTo( 28,  2);
  ctx.lineTo( 28, -6);
  ctx.lineTo(-28, -28);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = used ? '#aad044' : '#f0c040';
  ctx.beginPath();
  ctx.moveTo(-28, -28);
  ctx.lineTo( 28,  -6);
  ctx.lineTo( 28,  -4);
  ctx.lineTo(-28, -26);
  ctx.closePath();
  ctx.fill();
  // Arrow
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 9px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('↑ SALTO', 0, -10);
}

// ============================================================
//  RIDER
// ============================================================
function drawRider() {
  if (phase !== 'playing' && phase !== 'gameover') return;
  if (invincible > 0 && frameN % 6 < 3) return;

  const bx = worldToScreenX(rNX, 1);
  const by = RIDER_Y_BASE + rJump;

  // Shadow under rider when airborne
  if (rJump < -6) {
    const a = Math.max(0, 0.38 - (-rJump) * 0.007);
    const r = 18 + (-rJump) * 0.28;
    ctx.fillStyle = `rgba(0,0,0,${a})`;
    ctx.beginPath(); ctx.ellipse(bx, RIDER_Y_BASE + 4, r, 5, 0, 0, Math.PI*2); ctx.fill();
  }

  ctx.save();
  ctx.translate(bx, by);
  const lean = rVX * 16;
  ctx.rotate(lean * Math.PI / 180);

  if (crashed && crashTimer > 0) {
    const t = 1 - crashTimer / 38;
    ctx.save();
    ctx.rotate(t * 1.4);
    ctx.translate(t * 22, -t * 8);
    ctx.globalAlpha = Math.max(0.3, 1 - t * 0.5);
    ctx.fillStyle = '#e05510';
    ctx.beginPath(); ctx.ellipse(0, -10, 16, 7, t * 0.6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(12, -17, 8, 6, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  } else {
    // ---- Bike wheels ----
    ctx.lineWidth = 3;
    for (const [wx, wy, rw, rh] of [[-9, 8, 15, 10], [9, 8, 13, 9]]) {
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.ellipse(wx, wy, rw, rh, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#333';
      ctx.stroke();
      // Tire
      ctx.strokeStyle = '#555';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(wx, wy, rw-2, rh-2, 0, 0, Math.PI*2); ctx.stroke();
    }
    // Spokes
    ctx.strokeStyle = '#444'; ctx.lineWidth = 0.8;
    for (let a = 0; a < Math.PI; a += Math.PI/3) {
      for (const [wx,wy,rw,rh] of [[-9,8,13,9],[9,8,11,8]]) {
        ctx.beginPath();
        ctx.moveTo(wx + Math.cos(a)*rw, wy + Math.sin(a)*rh);
        ctx.lineTo(wx - Math.cos(a)*rw, wy - Math.sin(a)*rh);
        ctx.stroke();
      }
    }

    // ---- Frame ----
    ctx.strokeStyle = '#e05510';
    ctx.lineWidth = 2.5;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(-9,  0);
    ctx.lineTo( 0,  6);
    ctx.lineTo( 0, -14);
    ctx.lineTo(-9,  0);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, -14);
    ctx.lineTo(8,  -4);
    ctx.lineTo(0,   6);
    ctx.stroke();
    // Fork
    ctx.strokeStyle = '#999'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(6, -6); ctx.lineTo(9, 6); ctx.stroke();
    // Handlebars
    ctx.strokeStyle = '#bbb'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-11, -5); ctx.lineTo(11, -5); ctx.stroke();
    // Saddle
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.ellipse(-8, -4, 6, 2.5, -0.15, 0, Math.PI*2); ctx.fill();

    // ---- Rider body ----
    // Legs
    ctx.fillStyle = '#16163a';
    ctx.beginPath(); ctx.ellipse(-4, 2, 4, 8, -0.18, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( 4, 2, 4, 8,  0.18, 0, Math.PI*2); ctx.fill();
    // Shoes
    ctx.fillStyle = '#e05510';
    ctx.beginPath(); ctx.ellipse(-5,  9, 5, 3, -0.1, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( 5,  9, 5, 3,  0.1, 0, Math.PI*2); ctx.fill();

    // Torso
    ctx.fillStyle = '#e05510';
    ctx.beginPath();
    ctx.moveTo(-8, 0); ctx.lineTo(8, 0); ctx.lineTo(6, -19); ctx.lineTo(-6, -19);
    ctx.closePath(); ctx.fill();
    // Jersey number
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = 'bold 7px monospace'; ctx.textAlign = 'center';
    ctx.fillText('1', 0, -8);

    // Arms
    ctx.strokeStyle = '#e05510'; ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-6, -12); ctx.lineTo(-11, -5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo( 6, -12); ctx.lineTo( 11, -5); ctx.stroke();
    ctx.strokeStyle = '#cc4400'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-6, -12); ctx.lineTo(-11, -5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo( 6, -12); ctx.lineTo( 11, -5); ctx.stroke();

    // Helmet
    ctx.fillStyle = '#f0f0f0';
    ctx.beginPath(); ctx.ellipse(0, -24, 10, 8, 0, Math.PI, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e05510';
    ctx.beginPath(); ctx.ellipse(0, -24, 10, 8, 0, Math.PI*1.1, Math.PI*1.9); ctx.fill();
    // Visor
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.moveTo(-10, -23); ctx.lineTo(-14, -21); ctx.lineTo(14, -21); ctx.lineTo(10, -23);
    ctx.closePath(); ctx.fill();
    // Goggles
    ctx.fillStyle = '#1a6699';
    ctx.beginPath(); ctx.ellipse(-2, -19, 5, 3, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.ellipse(-2, -19, 5, 3, 0, 0, Math.PI*2); ctx.stroke();
    // Glint
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath(); ctx.ellipse(-4, -20, 1.5, 1, 0, 0, Math.PI*2); ctx.fill();

    // Backpack
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.roundRect(-7, -18, 6, 10, 2); ctx.fill();
  }

  ctx.restore();
}

// ============================================================
//  HUD
// ============================================================
function drawHUD() {
  // Distance pill
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  roundRect(ctx, 8, 8, 110, 28, 6);
  ctx.fill();
  ctx.fillStyle = '#e05510';
  ctx.font = 'bold 10px "Courier New", monospace';
  ctx.textAlign = 'left';
  ctx.fillText('KM', 16, 26);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px "Courier New", monospace';
  ctx.fillText(score.toString().padStart(5,' '), 38, 26);

  // Lives (dot style)
  for (let i = 0; i < 3; i++) {
    const cx = W - 18 - i * 22;
    ctx.fillStyle = i < lives ? '#e05510' : '#2a2a2a';
    ctx.beginPath(); ctx.arc(cx, 20, 8, 0, Math.PI*2); ctx.fill();
    if (i < lives) {
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.beginPath(); ctx.arc(cx-2, 16, 3, 0, Math.PI*2); ctx.fill();
    }
  }

  // Speed bar
  const spd = (speed - 1.6) / 3.2;
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  roundRect(ctx, 8, H-22, 76, 14, 4); ctx.fill();
  const hue = 120 - spd * 120;
  ctx.fillStyle = `hsl(${hue},80%,50%)`;
  roundRect(ctx, 8, H-22, Math.max(4, 76*spd), 14, 4); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = '7px monospace'; ctx.textAlign = 'left';
  ctx.fillText('VELOCIDAD', 12, H-12);

  // Best
  if (best > 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    roundRect(ctx, 8, 42, 110, 18, 4); ctx.fill();
    ctx.fillStyle = '#aaa';
    ctx.font = '8px monospace'; ctx.textAlign = 'left';
    ctx.fillText(`RÉCORD: ${best} KM`, 14, 54);
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

// ============================================================
//  SCREENS
// ============================================================
function drawMenu() {
  ctx.fillStyle = 'rgba(0,0,0,0.72)';
  ctx.fillRect(0, 0, W, H);

  // Logo
  ctx.save();
  ctx.translate(W/2, H/2 - 95);
  drawLogoRider();
  ctx.restore();

  ctx.fillStyle = '#e05510';
  ctx.font = 'bold 38px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.fillText('TRAIL', W/2, H/2 - 30);
  ctx.fillText('RIPPER', W/2, H/2 + 14);

  ctx.fillStyle = 'rgba(224,85,16,0.3)';
  ctx.fillRect(W/2 - 100, H/2 - 38, 200, 66);

  ctx.fillStyle = '#ddd';
  ctx.font = '9px "Courier New", monospace';
  ctx.fillText('← → MOVER   ↑ / SPACE  SALTAR', W/2, H/2 + 44);

  if (frameN % 44 < 28) {
    ctx.fillStyle = '#e05510';
    ctx.font = 'bold 11px "Courier New", monospace';
    ctx.fillText('[ PRESIONA PARA INICIAR ]', W/2, H/2 + 74);
  }

  ctx.fillStyle = '#444';
  ctx.font = '8px monospace';
  ctx.fillText('GRAVITAS SOLUTIONS  ·  MTB TRAIL', W/2, H - 14);
}

function drawLogoRider() {
  // Small preview rider for menu
  ctx.scale(0.7, 0.7);
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.ellipse(-9, 8, 14, 10, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 9, 8, 13,  9, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#e05510'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-9,0); ctx.lineTo(0,6); ctx.lineTo(0,-14); ctx.lineTo(-9,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(8,-4); ctx.lineTo(0,6); ctx.stroke();
  ctx.fillStyle = '#e05510';
  ctx.beginPath();
  ctx.moveTo(-8,0); ctx.lineTo(8,0); ctx.lineTo(6,-19); ctx.lineTo(-6,-19);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#f0f0f0';
  ctx.beginPath(); ctx.ellipse(0,-24,10,8,0,Math.PI,Math.PI*2); ctx.fill();
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.80)';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#e05510';
  ctx.font = 'bold 30px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.fillText('¡ CAÍDA !', W/2, H/2 - 70);

  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  roundRect(ctx, W/2-110, H/2-52, 220, 80, 8); ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.font = '13px "Courier New", monospace';
  ctx.fillText(`KM RECORRIDOS: ${score}`, W/2, H/2 - 18);

  if (score > 0 && score === best) {
    ctx.fillStyle = '#ffcc22';
    ctx.font = 'bold 12px monospace';
    ctx.fillText('★  NUEVO RÉCORD  ★', W/2, H/2 + 10);
  } else {
    ctx.fillStyle = '#888';
    ctx.font = '10px monospace';
    ctx.fillText(`RÉCORD: ${best} KM`, W/2, H/2 + 10);
  }

  if (frameN % 44 < 28) {
    ctx.fillStyle = '#e05510';
    ctx.font = 'bold 11px "Courier New", monospace';
    ctx.fillText('[ PRESS PARA REINTENTAR ]', W/2, H/2 + 55);
  }

  ctx.fillStyle = '#333';
  ctx.font = '8px monospace';
  ctx.fillText('GRAVITAS SOLUTIONS  ·  MTB TRAIL', W/2, H - 14);
}

// ============================================================
//  MAIN LOOP
// ============================================================
let lastT = 0;
function loop(ts) {
  const dt = Math.min((ts - lastT) / 16.67, 2.5);
  lastT = ts;
  frameN++;

  ctx.clearRect(0, 0, W, H);
  drawSky();
  drawMountains();
  drawTrail();
  drawForestSides();
  drawObstacles();
  drawRider();

  if (phase === 'playing') {
    update();
    drawHUD();
  } else if (phase === 'menu') {
    drawMenu();
  } else if (phase === 'gameover') {
    drawHUD();
    drawGameOver();
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
