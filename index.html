<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Trail Ripper — Valpo Urban POV</title>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #08090d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, Helvetica, sans-serif;
  }

  canvas {
    width: 1280px;
    height: 720px;
    max-width: 100vw;
    max-height: 100vh;
    background: #78bce8;
    image-rendering: auto;
  }
</style>
</head>

<body>
<canvas id="game" width="1280" height="720"></canvas>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;

  const keys = {};

  window.addEventListener("keydown", e => {
    keys[e.code] = true;

    if (
      e.code === "Space" ||
      e.code === "ArrowLeft" ||
      e.code === "ArrowRight" ||
      e.code === "KeyA" ||
      e.code === "KeyD" ||
      e.code === "KeyR"
    ) {
      e.preventDefault();
    }
  });

  window.addEventListener("keyup", e => {
    keys[e.code] = false;
  });

  const state = {
    frame: 0,
    distance: 0,
    speed: 62,
    score: 0,
    lives: 3,
    time: 90,
    playerX: 0,
    jump: 0,
    jumpVelocity: 0,
    airborne: false,
    invincible: 0,
    shake: 0,
    gameOver: false,
    lastSpawn: 0,
    objects: [],
    message: "",
    messageTimer: 0
  };

  function resetGame() {
    state.frame = 0;
    state.distance = 0;
    state.speed = 62;
    state.score = 0;
    state.lives = 3;
    state.time = 90;
    state.playerX = 0;
    state.jump = 0;
    state.jumpVelocity = 0;
    state.airborne = false;
    state.invincible = 0;
    state.shake = 0;
    state.gameOver = false;
    state.lastSpawn = 0;
    state.objects = [];
    state.message = "";
    state.messageTimer = 0;
  }

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function showMessage(text) {
    state.message = text;
    state.messageTimer = 70;
  }

  function roadCurve(z) {
    const d = state.distance * 0.003;
    return (
      Math.sin(d + z * 3.4) * 0.48 +
      Math.sin(d * 1.7 + z * 7.2) * 0.18
    );
  }

  function roadHill(z) {
    const d = state.distance * 0.004;
    return (
      Math.sin(d + z * 5.6) * 30 +
      Math.sin(d * 1.8 + z * 9.5) * 13
    );
  }

  function project(x, z) {
    const depth = Math.pow(1 - z, 2.18);
    const horizon = 238;
    const center =
      W / 2 +
      roadCurve(z) * (1 - z) * 530;

    const width = 120 + depth * 1100;
    const y =
      horizon +
      depth * (H - horizon + 80) +
      roadHill(z) * depth;

    return {
      x: center + x * width * 0.5,
      y,
      width,
      center,
      depth
    };
  }

  function spawnObject() {
    const roll = Math.random();
    let type = "barrier";

    if (roll < 0.35) type = "ramp";
    else if (roll < 0.58) type = "barrel";
    else if (roll < 0.78) type = "steps";
    else type = "gap";

    const laneOptions = [-0.55, 0, 0.55];
    const lane = laneOptions[Math.floor(Math.random() * laneOptions.length)];

    state.objects.push({
      type,
      lane,
      z: 1.08,
      hit: false
    });
  }

  function hitObject(obj) {
    if (obj.hit || state.invincible > 0) return;

    const dx = Math.abs(state.playerX - obj.lane);

    if (obj.type === "ramp") {
      if (dx < 0.35 && !state.airborne) {
        state.airborne = true;
        state.jumpVelocity = 18;
        state.jump = 1;
        state.score += 120;
        showMessage("SALTO +120");
      }

      return;
    }

    if (obj.type === "gap") {
      if (dx < 0.38 && state.jump < 18) {
        damage("CAIDA");
        obj.hit = true;
      }

      return;
    }

    if (dx < 0.34 && state.jump < 14) {
      damage("GOLPE");
      obj.hit = true;
    }
  }

  function damage(text) {
    state.lives--;
    state.speed = Math.max(42, state.speed - 11);
    state.shake = 16;
    state.invincible = 65;
    showMessage(text);

    if (state.lives <= 0) {
      state.gameOver = true;
    }
  }

  function update() {
    if (state.gameOver) {
      if (keys.KeyR) resetGame();
      return;
    }

    state.frame++;
    state.distance += state.speed;
    state.time -= 1 / 60;

    if (state.time <= 0) {
      state.gameOver = true;
    }

    const steer =
      (keys.ArrowRight || keys.KeyD ? 1 : 0) -
      (keys.ArrowLeft || keys.KeyA ? 1 : 0);

    state.playerX = clamp(state.playerX + steer * 0.035, -1, 1);

    const roadLimit = 0.88;

    if (Math.abs(state.playerX) > roadLimit) {
      state.speed = Math.max(42, state.speed - 0.05);

      if (state.frame % 50 === 0 && state.invincible <= 0) {
        damage("FUERA DE LINEA");
      }
    } else {
      state.speed = Math.min(74, state.speed + 0.012);
    }

    if (keys.Space && !state.airborne) {
      state.airborne = true;
      state.jumpVelocity = 16;
      state.jump = 1;
    }

    if (state.airborne) {
      state.jump += state.jumpVelocity;
      state.jumpVelocity -= 1.05;

      if (state.jump > 15 && state.jumpVelocity > -7) {
        if (keys.KeyA) {
          state.score += 12;
          showMessage("BACKFLIP +12");
        }

        if (keys.KeyD) {
          state.score += 10;
          showMessage("WHIP +10");
        }
      }

      if (state.jump <= 0) {
        state.jump = 0;
        state.jumpVelocity = 0;
        state.airborne = false;
      }
    }

    if (state.frame - state.lastSpawn > 92 + Math.random() * 48) {
      spawnObject();
      state.lastSpawn = state.frame;
    }

    for (const obj of state.objects) {
      obj.z -= state.speed * 0.00034;

      if (obj.z < 0.145 && obj.z > 0.02) {
        hitObject(obj);
      }
    }

    state.objects = state.objects.filter(obj => obj.z > -0.08);

    state.score += Math.floor(state.speed / 32);
    state.invincible = Math.max(0, state.invincible - 1);
    state.shake = Math.max(0, state.shake - 1);
    state.messageTimer = Math.max(0, state.messageTimer - 1);
  }

  function drawPolygon(points, fill, stroke = null, lineWidth = 1) {
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);

    for (let i = 1; i < points.length; i++) {
      ctx.lineTo(points[i].x, points[i].y);
    }

    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();

    if (stroke) {
      ctx.strokeStyle = stroke;
      ctx.lineWidth = lineWidth;
      ctx.stroke();
    }
  }

  function drawSky() {
    const gradient = ctx.createLinearGradient(0, 0, 0, H);
    gradient.addColorStop(0, "#66b9ef");
    gradient.addColorStop(0.45, "#c7e9ff");
    gradient.addColorStop(1, "#f2d5a4");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = "#2479aa";
    ctx.fillRect(0, 222, W, 78);

    ctx.fillStyle = "rgba(255,255,255,0.75)";
    for (let i = 0; i < 8; i++) {
      const x = (i * 190 - state.frame * 0.22) % 1450 - 90;
      const y = 62 + (i % 3) * 38;

      ctx.fillRect(x, y, 78, 12);
      ctx.fillRect(x + 22, y - 10, 42, 15);
    }

    ctx.fillStyle = "#255066";
    ctx.beginPath();
    ctx.moveTo(0, 240);
    ctx.lineTo(180, 190);
    ctx.lineTo(390, 238);
    ctx.lineTo(620, 168);
    ctx.lineTo(820, 238);
    ctx.lineTo(1050, 185);
    ctx.lineTo(W, 235);
    ctx.lineTo(W, 305);
    ctx.lineTo(0, 305);
    ctx.closePath();
    ctx.fill();
  }

  function drawUrbanValpo() {
    for (let side of [-1, 1]) {
      for (let i = 0; i < 8; i++) {
        const z = 0.18 + i * 0.105;
        const base = project(side * 1.16, z);
        const d = base.depth;
        const w = d * (95 + (i % 3) * 18);
        const h = d * (165 + (i % 4) * 45);
        const x = base.x - (side < 0 ? w : 0);
        const y = base.y - h;

        const colors = [
          "#d7684d",
          "#e3b85c",
          "#58a0bd",
          "#92b76a",
          "#c78367",
          "#bc5c79"
        ];

        ctx.fillStyle = colors[(i + (side > 0 ? 2 : 0)) % colors.length];
        ctx.fillRect(x, y, w, h);

        ctx.fillStyle = "rgba(0,0,0,0.22)";
        ctx.fillRect(x, y, w, h * 0.15);

        ctx.fillStyle = "#2e3642";
        const winW = Math.max(4, d * 18);
        const winH = Math.max(4, d * 24);

        for (let k = 0; k < 3; k++) {
          ctx.fillRect(
            x + w * 0.18 + k * w * 0.24,
            y + h * 0.28,
            winW,
            winH
          );

          ctx.fillRect(
            x + w * 0.18 + k * w * 0.24,
            y + h * 0.58,
            winW,
            winH
          );
        }

        ctx.fillStyle = "#2a2a2a";
        ctx.fillRect(x, y - d * 14, w, d * 14);

        ctx.fillStyle = "rgba(0,0,0,0.25)";
        if (side < 0) {
          ctx.fillRect(x + w - d * 12, y, d * 12, h);
        } else {
          ctx.fillRect(x, y, d * 12, h);
        }
      }
    }

    ctx.strokeStyle = "rgba(25,25,25,0.45)";
    ctx.lineWidth = 2;

    for (let i = 0; i < 6; i++) {
      const y = 115 + i * 22;
      ctx.beginPath();
      ctx.moveTo(0, y + Math.sin(state.frame * 0.01 + i) * 6);
      ctx.quadraticCurveTo(
        W / 2,
        y + 42 + Math.sin(state.frame * 0.02 + i) * 8,
        W,
        y + Math.cos(state.frame * 0.01 + i) * 6
      );
      ctx.stroke();
    }
  }

  function drawRoad() {
    for (let i = 30; i >= 0; i--) {
      const z1 = i / 31;
      const z2 = (i + 1) / 31;

      const left1 = project(-1, z1);
      const right1 = project(1, z1);
      const right2 = project(1, z2);
      const left2 = project(-1, z2);

      const shade = i % 2 === 0 ? "#8d877d" : "#9d968b";

      drawPolygon([left1, right1, right2, left2], shade);

      const leftCurb1 = project(-1.05, z1);
      const leftCurb2 = project(-1.05, z2);
      const rightCurb1 = project(1.05, z1);
      const rightCurb2 = project(1.05, z2);

      ctx.strokeStyle = i % 2 === 0 ? "#e7d9b9" : "#b95548";
      ctx.lineWidth = Math.max(2, left1.depth * 9);

      ctx.beginPath();
      ctx.moveTo(leftCurb1.x, leftCurb1.y);
      ctx.lineTo(leftCurb2.x, leftCurb2.y);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(rightCurb1.x, rightCurb1.y);
      ctx.lineTo(rightCurb2.x, rightCurb2.y);
      ctx.stroke();

      if (i % 6 < 3) {
        const mid1 = project(0, z1);
        const mid2 = project(0, z2);

        ctx.strokeStyle = "#f3d34e";
        ctx.lineWidth = Math.max(1, left1.depth * 4);

        ctx.beginPath();
        ctx.moveTo(mid1.x, mid1.y);
        ctx.lineTo(mid2.x, mid2.y);
        ctx.stroke();
      }
    }

    for (let i = 0; i < 8; i++) {
      const z = 0.18 + i * 0.1;
      const p = project(-0.98, z);
      const s = p.depth;

      ctx.fillStyle = "#2a2d32";
      ctx.fillRect(p.x - s * 18, p.y - s * 110, s * 12, s * 110);

      ctx.fillStyle = "#f2c34a";
      ctx.beginPath();
      ctx.arc(p.x - s * 12, p.y - s * 115, s * 16, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawObject(obj) {
    const p = project(obj.lane, obj.z);
    const s = p.depth;

    if (s <= 0) return;

    ctx.save();
    ctx.translate(p.x, p.y);

    if (obj.hit) {
      ctx.globalAlpha = 0.35;
    }

    ctx.scale(s, s);

    if (obj.type === "ramp") {
      ctx.fillStyle = "#4a8ca5";
      ctx.fillRect(-72, -26, 144, 52);

      ctx.fillStyle = "#25596f";
      ctx.beginPath();
      ctx.moveTo(-72, 26);
      ctx.lineTo(72, 26);
      ctx.lineTo(42, -26);
      ctx.lineTo(-72, -26);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "#1d3947";
      ctx.lineWidth = 5;
      ctx.strokeRect(-72, -26, 144, 52);
    }

    if (obj.type === "barrel") {
      ctx.fillStyle = "#a04833";
      ctx.fillRect(-34, -82, 68, 82);

      ctx.fillStyle = "#5f2921";
      ctx.fillRect(-40, -88, 80, 12);
      ctx.fillRect(-40, -45, 80, 10);
      ctx.fillRect(-40, -5, 80, 10);
    }

    if (obj.type === "steps") {
      ctx.fillStyle = "#c9baa0";

      for (let i = 0; i < 5; i++) {
        ctx.fillRect(-78 + i * 9, -18 - i * 17, 156 - i * 18, 16);
      }

      ctx.strokeStyle = "#7b6d5b";
      ctx.lineWidth = 3;
      ctx.strokeRect(-78, -86, 156, 84);
    }

    if (obj.type === "gap") {
      ctx.fillStyle = "#1b1b1b";
      ctx.fillRect(-92, -6, 184, 38);

      ctx.fillStyle = "#d0b58b";
      ctx.fillRect(-120, -20, 60, 20);
      ctx.fillRect(60, -20, 60, 20);
    }

    ctx.restore();
  }

  function drawBike() {
    const bob = Math.sin(state.frame * 0.17) * 2 - state.jump * 0.26;

    ctx.save();
    ctx.translate(0, bob);

    ctx.strokeStyle = "#111";
    ctx.lineWidth = 18;
    ctx.lineCap = "round";

    ctx.beginPath();
    ctx.moveTo(330, 612);
    ctx.quadraticCurveTo(W / 2, 570, 950, 612);
    ctx.stroke();

    ctx.strokeStyle = "#222";
    ctx.lineWidth = 8;

    ctx.beginPath();
    ctx.moveTo(W / 2, 592);
    ctx.lineTo(W / 2, 690);
    ctx.stroke();

    ctx.fillStyle = "#191919";
    ctx.fillRect(W / 2 - 56, 590, 112, 34);

    ctx.fillStyle = "#1b6fb5";
    ctx.fillRect(W / 2 - 37, 624, 74, 90);

    ctx.fillStyle = "#c38554";
    ctx.fillRect(0, 592, 330, 78);
    ctx.fillRect(950, 592, 330, 78);

    ctx.fillStyle = "#1b5ea2";
    ctx.fillRect(265, 568, 90, 70);
    ctx.fillRect(925, 568, 90, 70);

    ctx.restore();
  }

  function drawBox(x, y, w, h, label, value) {
    ctx.fillStyle = "rgba(0,0,0,0.72)";
    ctx.fillRect(x, y, w, h);

    ctx.strokeStyle = "#d9aa35";
    ctx.lineWidth = 3;
    ctx.strokeRect(x + 2, y + 2, w - 4, h - 4);

    ctx.textAlign = "center";
    ctx.fillStyle = "#f4c247";
    ctx.font = "bold 22px Arial";
    ctx.fillText(label, x + w / 2, y + 28);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 38px Arial";
    ctx.fillText(value, x + w / 2, y + h - 18);
  }

  function drawHUD() {
    drawBox(28, 24, 190, 86, "TIEMPO", Math.max(0, state.time).toFixed(1));
    drawBox(W / 2 - 115, 22, 230, 88, "PUNTOS", state.score);
    drawBox(W - 218, 24, 190, 86, "STAGE", "1/5");

    ctx.fillStyle = "rgba(0,0,0,0.68)";
    ctx.fillRect(28, H - 84, 160, 54);

    ctx.fillStyle = "#f4c247";
    ctx.font = "bold 20px Arial";
    ctx.textAlign = "left";
    ctx.fillText("VIDAS", 48, H - 54);

    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i < state.lives ? "#e2252b" : "#3b3b3b";
      ctx.beginPath();
      ctx.arc(62 + i * 38, H - 34, 13, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = "rgba(0,0,0,0.68)";
    ctx.fillRect(W - 214, H - 88, 186, 58);

    ctx.fillStyle = "#f4c247";
    ctx.font = "bold 19px Arial";
    ctx.fillText("VELOCIDAD", W - 196, H - 60);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 31px Arial";
    ctx.fillText(Math.round(state.speed) + " KM/H", W - 196, H - 34);

    if (state.messageTimer > 0 && state.message) {
      ctx.fillStyle = "rgba(0,0,0,0.7)";
      ctx.fillRect(42, 132, 245, 72);

      ctx.fillStyle = "#f4c247";
      ctx.font = "bold 21px Arial";
      ctx.fillText("EVENTO", 62, 162);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 26px Arial";
      ctx.fillText(state.message, 62, 194);
    }

    ctx.fillStyle = "rgba(0,0,0,0.72)";
    ctx.fillRect(0, H - 28, W, 28);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 19px Arial";
    ctx.textAlign = "left";
    ctx.fillText("VALPARAISO CERRO ABAJO — TRAIL RIPPER", 24, H - 8);
  }

  function drawGameOver() {
    ctx.fillStyle = "rgba(0,0,0,0.78)";
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = "center";
    ctx.fillStyle = "#f4c247";
    ctx.font = "bold 68px Arial";
    ctx.fillText("GAME OVER", W / 2, H / 2 - 42);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 30px Arial";
    ctx.fillText("Puntos: " + state.score, W / 2, H / 2 + 10);

    ctx.font = "22px Arial";
    ctx.fillText("Presiona R para reiniciar", W / 2, H / 2 + 58);
  }

  function draw() {
    const sx = state.shake ? (Math.random() - 0.5) * state.shake : 0;
    const sy = state.shake ? (Math.random() - 0.5) * state.shake : 0;

    ctx.save();
    ctx.translate(sx, sy);

    drawSky();
    drawUrbanValpo();
    drawRoad();

    [...state.objects]
      .sort((a, b) => b.z - a.z)
      .forEach(drawObject);

    drawBike();
    drawHUD();

    if (state.gameOver) {
      drawGameOver();
    }

    ctx.restore();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  loop();
})();
</script>
</body>
</html>
