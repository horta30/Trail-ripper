<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>TRAIL RIPPER — Stage Crono</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0d0d;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}
canvas{display:block;width:400px;height:600px;max-width:100vw;box-shadow:0 0 60px rgba(180,230,0,.2);cursor:crosshair}
@media(max-width:420px){canvas{width:100vw;height:calc(100vw*1.5)}}
</style>
</head>
<body>
<canvas id="c" width="400" height="600"></canvas>
<script>
var cv=document.getElementById('c'),cx=cv.getContext('2d');
var W=400,H=600,HY=H*.30,RY=H*.63,VPX=W/2;

// ─── AUDIO ──────────────────────────────────────────────────────────
var AC=null;
function initAC(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();}
function tone(freq,dur,vol,type,sweep){
  if(!AC)return;
  var o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);
  o.type=type||'square';
  o.frequency.setValueAtTime(freq,AC.currentTime);
  if(sweep)o.frequency.exponentialRampToValueAtTime(sweep,AC.currentTime+dur*.8);
  g.gain.setValueAtTime(vol||.15,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);
  o.start();o.stop(AC.currentTime+dur);
}
function noise(dur,vol){
  if(!AC)return;
  var buf=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate);
  var d=buf.getChannelData(0);
  for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  var s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();
  f.type='bandpass';f.frequency.value=350;
  s.buffer=buf;s.connect(f);f.connect(g);g.connect(AC.destination);
  g.gain.value=vol||.4;s.start();
}
function sndJump(){tone(280,0.18,.12,'sine',560);}
function sndLand(){tone(160,0.08,.08,'sine');}
function sndKicker(){tone(200,0.05,.1,'sine',900);setTimeout(function(){tone(500,.2,.1,'sine',1100);},60);}
function sndCrash(){noise(.35,.5);tone(180,.4,.12,'sawtooth',60);}
function sndScore(){tone(880,.08,.07,'sine',1100);}

// ─── PERSPECTIVE ───────────────────────────────────────────────────
function tL(z){return VPX-(36+(270-36)*z)/2;}
function tR(z){return VPX+(36+(270-36)*z)/2;}
function wX(n,z){return VPX+n*(36+(270-36)*z)/2;}
function wY(z){return HY+(RY-HY)*z;}
function sc(z){return .10+.90*z;}

// ─── STATE ─────────────────────────────────────────────────────────
var phase='menu',score=0,best=0,speed=1.6,dist=0,lives=3,fn=0;
var rNX=0,rVX=0,rJ=0,rJV=0,rGnd=true,inv=0,crash=false,cT=0;
var obs=[],spc=0,tsc=0;
var lastScore=0;
var keys={},tDir=0,tJump=false;
var mtns=[];
for(var xi=0;xi<=W;xi+=18)mtns.push(H*.17+Math.sin(xi*.009)*28+Math.sin(xi*.025)*14);

// ─── CONTROLS ──────────────────────────────────────────────────────
document.addEventListener('keydown',function(e){
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowLeft','ArrowRight'].indexOf(e.code)>=0)e.preventDefault();
  if(phase!=='playing'){initAC();go();}
});
document.addEventListener('keyup',function(e){keys[e.code]=false;});
cv.addEventListener('touchstart',function(e){
  e.preventDefault();
  initAC();
  if(phase!=='playing'){go();return;}
  var r=cv.getBoundingClientRect(),x=(e.touches[0].clientX-r.left)/r.width*W;
  if(x<W*.3)tDir=-1;else if(x>W*.7)tDir=1;else tJump=true;
},{passive:false});
cv.addEventListener('touchmove',function(e){
  e.preventDefault();
  var r=cv.getBoundingClientRect(),x=(e.touches[0].clientX-r.left)/r.width*W;
  tDir=x<W*.3?-1:x>W*.7?1:0;
},{passive:false});
cv.addEventListener('touchend',function(){tDir=0;});
cv.addEventListener('click',function(){initAC();if(phase!=='playing')go();});

function go(){
  phase='playing';score=0;dist=0;speed=1.6;lives=3;fn=0;
  rNX=0;rVX=0;rJ=0;rJV=0;rGnd=true;inv=0;crash=false;cT=0;
  obs=[];spc=0;tsc=0;lastScore=0;
}
function jump(p){
  if(!rGnd)return;
  rJV=-(p||13);rGnd=false;
  if(p&&p>14)sndKicker();else sndJump();
}

// ─── UPDATE ────────────────────────────────────────────────────────
function update(){
  speed=Math.min(4.8,1.6+dist*.00028);
  dist+=speed;score=Math.floor(dist/10);
  tsc=(tsc+speed*2.8)%52;
  if(score>0&&score%50===0&&score!==lastScore){sndScore();lastScore=score;}

  var ax=0;
  if(keys['ArrowLeft']||keys['KeyA'])ax=-1;
  if(keys['ArrowRight']||keys['KeyD'])ax=1;
  if(tDir)ax=tDir;
  if((keys['Space']||keys['ArrowUp']||tJump)&&rGnd)jump();
  tJump=false;

  rVX+=ax*.075;rVX*=.80;
  rNX+=rVX*.042;rNX=Math.max(-.88,Math.min(.88,rNX));

  var wasAir=!rGnd;
  if(!rGnd){rJV+=.85;rJ+=rJV;if(rJ>=0){rJ=0;rJV=0;rGnd=true;if(wasAir)sndLand();}}

  spc--;
  if(spc<=0){
    var r=Math.random(),t=r<.35?'rock':r<.6?'log':r<.8?'tree':'kick';
    var nx=Math.max(-.75,Math.min(.75,(Math.random()-.5)*1.4));
    obs.push({t:t,nx:nx,z:0,hit:false,used:false});
    spc=Math.max(22,58-dist*.015)+(Math.random()*28|0);
  }

  var dz=speed*.011;
  for(var i=obs.length-1;i>=0;i--){
    var o=obs[i];o.z+=dz;
    if(o.t==='kick'&&!o.used&&o.z>.90&&o.z<1.06&&Math.abs(rNX-o.nx)<.22&&rGnd){o.used=true;jump(18);}
    if(!o.hit&&o.t!=='kick'&&inv<=0&&o.z>.87&&o.z<1.06){
      var dx=Math.abs(rNX-o.nx),hw=o.t==='tree'?.17:.14;
      if(dx<hw&&!((o.t==='rock'||o.t==='log')&&rJ<-16)){
        o.hit=true;crash=true;cT=40;inv=110;rJV=-9;rGnd=false;
        sndCrash();
        lives--;
        if(lives<=0)setTimeout(function(){if(score>best)best=score;phase='gameover';},800);
      }
    }
    if(o.z>1.25)obs.splice(i,1);
  }
  if(inv>0)inv--;
  if(crash&&--cT<=0)crash=false;
}

// ─── DRAW HELPERS ──────────────────────────────────────────────────
function pill(x,y,w,h,r){
  cx.beginPath();cx.moveTo(x+r,y);cx.lineTo(x+w-r,y);cx.arcTo(x+w,y,x+w,y+r,r);
  cx.lineTo(x+w,y+h-r);cx.arcTo(x+w,y+h,x+w-r,y+h,r);
  cx.lineTo(x+r,y+h);cx.arcTo(x,y+h,x,y+h-r,r);
  cx.lineTo(x,y+r);cx.arcTo(x,y,x+r,y,r);cx.closePath();
}

// ─── LOGO (canvas-rendered, no PNG) ────────────────────────────────
function drawLogo(){
  cx.save();cx.translate(W/2-4,22);

  // Icon: hexagon frame + lightning
  cx.save();cx.translate(-58,8);cx.scale(.55,.55);
  // Outer hex
  cx.strokeStyle='#9ae62a';cx.lineWidth=5;
  cx.beginPath();
  var pts=[[-20,-34],[20,-34],[38,0],[20,34],[-20,34],[-38,0]];
  cx.moveTo(pts[0][0],pts[0][1]);
  for(var p=1;p<pts.length;p++)cx.lineTo(pts[p][0],pts[p][1]);
  cx.closePath();cx.stroke();
  // Inner C-shape (left arc)
  cx.strokeStyle='#9ae62a';cx.lineWidth=5;
  cx.beginPath();cx.arc(0,0,20,Math.PI*.6,Math.PI*1.4);cx.stroke();
  // Lightning bolt
  cx.fillStyle='#9ae62a';
  cx.beginPath();cx.moveTo(4,-26);cx.lineTo(-8,2);cx.lineTo(2,2);cx.lineTo(-4,26);cx.lineTo(14,-2);cx.lineTo(4,-2);cx.closePath();cx.fill();
  cx.restore();

  // "STAGE" text
  cx.fillStyle='#ffffff';cx.font='bold 17px Impact,Arial Black,sans-serif';
  cx.textAlign='left';cx.fillText('STAGE',-28,-5);
  // "CRONO" text
  cx.fillStyle='#9ae62a';cx.font='bold 20px Impact,Arial Black,sans-serif';
  cx.fillText('CRONO',-28,16);
  // tagline
  cx.fillStyle='rgba(255,255,255,.45)';cx.font='6px Arial,sans-serif';
  cx.textAlign='center';cx.fillText('THE MOUNTAIN IS RACING',28,28);

  cx.restore();
}

// ─── SCENE ─────────────────────────────────────────────────────────
function sky(){
  var g=cx.createLinearGradient(0,0,0,HY+30);
  g.addColorStop(0,'#0c0b1a');g.addColorStop(.55,'#1e3655');g.addColorStop(1,'#3a6878');
  cx.fillStyle=g;cx.fillRect(0,0,W,HY+30);
  drawLogo();
}
function mountains(){
  cx.beginPath();cx.moveTo(0,HY+12);
  for(var i=0;i<mtns.length;i++)cx.lineTo(i*18,mtns[i]);
  cx.lineTo(W,HY+12);cx.closePath();cx.fillStyle='#132a1c';cx.fill();
  cx.beginPath();cx.moveTo(0,HY+12);
  for(var i=0;i<mtns.length;i++)cx.lineTo(i*18,mtns[i]+20+Math.sin(i*.4)*8);
  cx.lineTo(W,HY+12);cx.closePath();cx.fillStyle='#0e1f14';cx.fill();
}
function trail(){
  cx.fillStyle='#1c3a1c';cx.fillRect(0,HY,W,H-HY);
  cx.beginPath();cx.moveTo(tL(0),HY);cx.lineTo(tR(0),HY);cx.lineTo(tR(1),H);cx.lineTo(tL(1),H);cx.closePath();
  var tg=cx.createLinearGradient(0,HY,0,H);
  tg.addColorStop(0,'#3a2510');tg.addColorStop(.45,'#56361c');tg.addColorStop(1,'#6b4228');
  cx.fillStyle=tg;cx.fill();
  for(var i=0;i<9;i++){
    var z0=(i+tsc/52)/9,z1=(i+1+tsc/52)/9;
    if(z0>1||z1<0||i%2===0)continue;
    cx.beginPath();
    cx.moveTo(wX(-.06,z0),wY(z0));cx.lineTo(wX(.06,z0),wY(z0));
    cx.lineTo(wX(.06,Math.min(z1,1)),wY(Math.min(z1,1)));
    cx.lineTo(wX(-.06,Math.min(z1,1)),wY(Math.min(z1,1)));
    cx.closePath();cx.fillStyle='rgba(100,65,35,'+(.22+(z0+z1)*.14)+')';cx.fill();
  }
  cx.strokeStyle='#7a5030';cx.lineWidth=1.5;
  cx.beginPath();cx.moveTo(tL(0),HY);cx.lineTo(tL(1),H);cx.stroke();
  cx.beginPath();cx.moveTo(tR(0),HY);cx.lineTo(tR(1),H);cx.stroke();
}
function pine(x,y,s){
  var h=85*s,w=30*s;
  cx.fillStyle='#2e1508';cx.fillRect(x-4*s,y-h*.28,8*s,h*.32);
  var cs=['#093209','#0d4a0d','#175a17'];
  for(var L=0;L<3;L++){
    cx.fillStyle=cs[L];cx.beginPath();
    cx.moveTo(x,y-h*.15-L*h*.24-h*.26);
    cx.lineTo(x+w*(1-L*.22)/2,y-h*.15-L*h*.24);
    cx.lineTo(x-w*(1-L*.22)/2,y-h*.15-L*h*.24);
    cx.closePath();cx.fill();
  }
}
function forest(){
  for(var i=0;i<7;i++){
    var z=((i/7)+tsc/52*.45)%1,s=sc(z),sy=wY(z);
    pine(tL(z)-16*s,sy,s);pine(tR(z)+16*s,sy,s);
  }
}
function obstacles(){
  var sorted=obs.slice().sort(function(a,b){return a.z-b.z;});
  for(var i=0;i<sorted.length;i++){
    var o=sorted[i];if(o.z<.04)continue;
    var s=sc(o.z),sx=wX(o.nx,o.z),sy=wY(o.z);
    cx.save();cx.translate(sx,sy);cx.scale(s,s);
    if(o.t==='rock'){
      cx.fillStyle=o.hit?'#ff5533':'#707070';
      cx.beginPath();cx.moveTo(-20,2);cx.lineTo(-24,-6);cx.lineTo(-14,-17);
      cx.lineTo(2,-20);cx.lineTo(18,-11);cx.lineTo(22,2);cx.closePath();cx.fill();
    }else if(o.t==='log'){
      cx.fillStyle=o.hit?'#ff6644':'#7a4518';cx.fillRect(-30,-12,60,10);
      cx.fillStyle=o.hit?'#ff8855':'#9a5a20';cx.beginPath();cx.ellipse(0,-12,30,7,0,0,Math.PI*2);cx.fill();
      cx.fillStyle=o.hit?'#cc3300':'#5a3010';
      cx.beginPath();cx.ellipse(-30,-7,6,9,0,0,Math.PI*2);cx.fill();
      cx.beginPath();cx.ellipse(30,-7,6,9,0,0,Math.PI*2);cx.fill();
    }else if(o.t==='tree'){
      cx.fillStyle=o.hit?'#ff3322':'#1a0a03';cx.fillRect(-6,-56,12,56);
      var cs=o.hit?['#ff5544','#ff4433','#ff3322']:['#082008','#0c2e0c','#114411'];
      for(var L=0;L<3;L++){
        cx.fillStyle=cs[L];cx.beginPath();
        cx.moveTo(0,-56-L*14);cx.lineTo(26-L*4,-36-L*8);cx.lineTo(-26+L*4,-36-L*8);
        cx.closePath();cx.fill();
      }
    }else{
      cx.fillStyle='#cc9922';
      cx.beginPath();cx.moveTo(-28,2);cx.lineTo(28,2);cx.lineTo(28,-6);cx.lineTo(-28,-28);cx.closePath();cx.fill();
      cx.fillStyle='#f0c040';
      cx.beginPath();cx.moveTo(-28,-28);cx.lineTo(28,-6);cx.lineTo(28,-4);cx.lineTo(-28,-26);cx.closePath();cx.fill();
      cx.fillStyle='#9ae62a';cx.font='bold 8px monospace';cx.textAlign='center';cx.fillText('JUMP',0,-11);
    }
    cx.restore();
  }
}

// ─── RIDER ────────────────────────────────────────────────────────
function drawRider(){
  if(phase!=='playing'&&phase!=='gameover')return;
  if(inv>0&&fn%6<3)return;
  var bx=wX(rNX,1),by=RY+rJ;
  // ground shadow
  if(rJ<-4){
    cx.fillStyle='rgba(0,0,0,'+Math.max(0,.35-(-rJ)*.006)+')';
    cx.beginPath();cx.ellipse(bx,RY+6,22+(-rJ)*.3,5,0,0,Math.PI*2);cx.fill();
  }
  cx.save();cx.translate(bx,by);cx.rotate(rVX*12*Math.PI/180);

  if(crash&&cT>0){
    var t=1-cT/40;
    cx.save();cx.rotate(t*1.6);cx.translate(t*28,-t*12);cx.globalAlpha=Math.max(.25,1-t*.6);
    cx.fillStyle='#e05510';cx.beginPath();cx.ellipse(0,-6,20,11,t*.8,0,Math.PI*2);cx.fill();
    cx.fillStyle='#ddd';cx.beginPath();cx.arc(12,-16,9,0,Math.PI*2);cx.fill();
    cx.restore();
    cx.restore();return;
  }

  var steer=rVX*.18;

  // ── REAR WHEEL  (vertical: seen head-on from behind)
  var WY=24, WR=21;
  // tire
  cx.fillStyle='#111';cx.beginPath();cx.arc(0,WY,WR,0,Math.PI*2);cx.fill();
  // rim band
  cx.strokeStyle='#3d3d3d';cx.lineWidth=5;cx.beginPath();cx.arc(0,WY,WR-2,0,Math.PI*2);cx.stroke();
  // inner rim
  cx.strokeStyle='#555';cx.lineWidth=2;cx.beginPath();cx.arc(0,WY,WR-6,0,Math.PI*2);cx.stroke();
  // 5 spokes — radial, no crossing
  cx.strokeStyle='#666';cx.lineWidth=1.8;
  for(var a=0;a<Math.PI*2;a+=Math.PI*2/5){
    cx.beginPath();
    cx.moveTo(Math.cos(a)*5, WY+Math.sin(a)*5);
    cx.lineTo(Math.cos(a)*(WR-6), WY+Math.sin(a)*(WR-6));
    cx.stroke();
  }
  // hub
  cx.fillStyle='#aaa';cx.beginPath();cx.arc(0,WY,5,0,Math.PI*2);cx.fill();
  cx.fillStyle='#444';cx.beginPath();cx.arc(0,WY,2.5,0,Math.PI*2);cx.fill();

  // ── FRAME — seat stays form clear V upward from hub (proves wheel is vertical)
  cx.strokeStyle='#c84010';cx.lineWidth=3.5;cx.lineCap='round';
  // left seat stay: hub → left seat junction
  cx.beginPath();cx.moveTo(-3,WY);cx.lineTo(-9,-20);cx.stroke();
  // right seat stay: hub → right seat junction
  cx.beginPath();cx.moveTo(3,WY);cx.lineTo(9,-20);cx.stroke();
  // seat cross-member
  cx.strokeStyle='#ff5520';cx.lineWidth=3;
  cx.beginPath();cx.moveTo(-9,-20);cx.lineTo(9,-20);cx.stroke();
  // chainstays (hub to bottom bracket, foreshortened from behind)
  cx.strokeStyle='#aa3008';cx.lineWidth=3;
  cx.beginPath();cx.moveTo(-3,WY);cx.lineTo(-6,-2);cx.stroke();
  cx.beginPath();cx.moveTo(3,WY);cx.lineTo(6,-2);cx.stroke();
  cx.strokeStyle='#ff5520';cx.lineWidth=4;
  cx.beginPath();cx.moveTo(-7,-2);cx.lineTo(7,-2);cx.stroke(); // bottom bracket

  // ── FRONT WHEEL — small, peeking above rider, tilts with steering
  var fRY=Math.max(7,13-Math.abs(steer)*12);
  cx.fillStyle='#111';cx.beginPath();cx.ellipse(0,-32,12*.55,fRY*.55,steer,0,Math.PI*2);cx.fill();
  cx.strokeStyle='#444';cx.lineWidth=3;cx.beginPath();cx.ellipse(0,-32,12*.55,fRY*.55,steer,0,Math.PI*2);cx.stroke();
  // fork tubes from bottom bracket area up to front wheel
  cx.strokeStyle='#999';cx.lineWidth=2;
  cx.beginPath();cx.moveTo(-5,-2);cx.quadraticCurveTo(-8,-16,-6,-32);cx.stroke();
  cx.beginPath();cx.moveTo(5,-2);cx.quadraticCurveTo(8,-16,6,-32);cx.stroke();

  // ── LEGS — outside the V frame on both sides
  cx.fillStyle='#16163a';
  // left thigh (from hip down-outward to knee)
  cx.beginPath();cx.moveTo(-11,-10);cx.lineTo(-22,5);cx.lineTo(-18,9);cx.lineTo(-7,-6);cx.closePath();cx.fill();
  // left shin (knee to foot)
  cx.beginPath();cx.moveTo(-22,5);cx.lineTo(-21,WY+2);cx.lineTo(-17,WY+2);cx.lineTo(-18,5);cx.closePath();cx.fill();
  // right thigh
  cx.beginPath();cx.moveTo(11,-10);cx.lineTo(22,5);cx.lineTo(18,9);cx.lineTo(7,-6);cx.closePath();cx.fill();
  // right shin
  cx.beginPath();cx.moveTo(22,5);cx.lineTo(21,WY+2);cx.lineTo(17,WY+2);cx.lineTo(18,5);cx.closePath();cx.fill();
  // shoes
  cx.fillStyle='#222';
  cx.beginPath();cx.moveTo(-25,WY+1);cx.lineTo(-13,WY+1);cx.lineTo(-12,WY+5);cx.lineTo(-26,WY+5);cx.closePath();cx.fill();
  cx.beginPath();cx.moveTo(25,WY+1);cx.lineTo(13,WY+1);cx.lineTo(12,WY+5);cx.lineTo(26,WY+5);cx.closePath();cx.fill();
  // shoe accent
  cx.fillStyle='#e05510';cx.fillRect(-25,WY+1,5,4);cx.fillRect(21,WY+1,5,4);
  // pedals
  cx.fillStyle='#666';cx.fillRect(-26,WY-1,14,3);cx.fillRect(14,WY-1,14,3);

  // ── BODY — back of rider (bent forward = body leans toward horizon)
  // shorts / hips
  cx.fillStyle='#16163a';
  cx.beginPath();cx.moveTo(-13,-8);cx.lineTo(13,-8);cx.lineTo(11,2);cx.lineTo(-11,2);cx.closePath();cx.fill();
  // jersey BACK — wider at shoulders, tapers to hips
  cx.fillStyle='#e05510';
  cx.beginPath();
  cx.moveTo(-13,-8);  // hip left
  cx.lineTo(-14,-28); // shoulder left
  cx.lineTo(14,-28);  // shoulder right
  cx.lineTo(13,-8);   // hip right
  cx.closePath();cx.fill();
  // jersey side stripes (darker)
  cx.fillStyle='#c83a00';
  cx.beginPath();cx.moveTo(-14,-28);cx.lineTo(-13,-8);cx.lineTo(-8,-8);cx.lineTo(-9,-28);cx.closePath();cx.fill();
  cx.beginPath();cx.moveTo(14,-28);cx.lineTo(13,-8);cx.lineTo(8,-8);cx.lineTo(9,-28);cx.closePath();cx.fill();
  // spine seam
  cx.strokeStyle='#c83a00';cx.lineWidth=1.5;
  cx.beginPath();cx.moveTo(0,-8);cx.lineTo(0,-28);cx.stroke();
  // number plate
  cx.fillStyle='rgba(255,255,255,.9)';cx.fillRect(-5,-21,10,9);
  cx.fillStyle='#e05510';cx.font='bold 6px monospace';cx.textAlign='center';cx.fillText('1',0,-14);

  // ── ARMS — backs of arms going forward-down to bars
  cx.strokeStyle='#e05510';cx.lineWidth=7;cx.lineCap='round';
  cx.beginPath();cx.moveTo(-13,-27);cx.quadraticCurveTo(-18,-22,-22,-15);cx.stroke();
  cx.strokeStyle='#c83a00';cx.lineWidth=4;
  cx.beginPath();cx.moveTo(-13,-27);cx.quadraticCurveTo(-18,-22,-22,-15);cx.stroke();
  cx.strokeStyle='#e05510';cx.lineWidth=7;
  cx.beginPath();cx.moveTo(13,-27);cx.quadraticCurveTo(18,-22,22,-15);cx.stroke();
  cx.strokeStyle='#c83a00';cx.lineWidth=4;
  cx.beginPath();cx.moveTo(13,-27);cx.quadraticCurveTo(18,-22,22,-15);cx.stroke();
  // gloves
  cx.fillStyle='#222';
  cx.beginPath();cx.arc(-22,-15,4,0,Math.PI*2);cx.fill();
  cx.beginPath();cx.arc(22,-15,4,0,Math.PI*2);cx.fill();
  // handlebar (tilts with steering)
  cx.strokeStyle='#777';cx.lineWidth=5;
  cx.beginPath();cx.moveTo(-24,-14+steer*10);cx.lineTo(24,-14-steer*10);cx.stroke();
  cx.strokeStyle='#aaa';cx.lineWidth=2.5;
  cx.beginPath();cx.moveTo(-24,-14+steer*10);cx.lineTo(24,-14-steer*10);cx.stroke();
  cx.fillStyle='#333';
  cx.beginPath();cx.arc(-24,-14+steer*10,4,0,Math.PI*2);cx.fill();
  cx.beginPath();cx.arc(24,-14-steer*10,4,0,Math.PI*2);cx.fill();

  // ── HELMET — full-face motocross integral (from behind)
  var HY2=-42; // helmet center y
  // main shell — elongated oval (wider than tall, big MX shape)
  cx.fillStyle='#eeeeee';
  cx.beginPath();cx.ellipse(0,HY2,14,12,0,0,Math.PI*2);cx.fill();
  // upper shell orange
  cx.fillStyle='#e05510';
  cx.beginPath();cx.ellipse(0,HY2,14,12,0,Math.PI,Math.PI*2);cx.fill();
  // green racing stripe
  cx.fillStyle='#9ae62a';cx.fillRect(-14,HY2-1,28,4);
  // REAR SCOOP / air duct (characteristic MX feature)
  cx.fillStyle='#ddd';
  cx.beginPath();cx.moveTo(-8,HY2-10);cx.lineTo(-6,HY2-16);cx.lineTo(6,HY2-16);cx.lineTo(8,HY2-10);cx.closePath();cx.fill();
  cx.fillStyle='#e05510';
  cx.beginPath();cx.moveTo(-8,HY2-10);cx.lineTo(-6,HY2-16);cx.lineTo(6,HY2-16);cx.lineTo(8,HY2-10);cx.closePath();cx.fill();
  // visor/peak on top (large MX peak, from behind looks like a shelf)
  cx.fillStyle='#222';
  cx.beginPath();cx.moveTo(-15,HY2-9);cx.lineTo(-18,HY2-14);cx.lineTo(18,HY2-14);cx.lineTo(15,HY2-9);cx.closePath();cx.fill();
  cx.fillStyle='#333';
  cx.beginPath();cx.moveTo(-15,HY2-9);cx.lineTo(-18,HY2-14);cx.lineTo(18,HY2-14);cx.lineTo(15,HY2-9);cx.closePath();cx.fill();
  // chin guard (from behind: lower portion of helmet wrapping under)
  cx.fillStyle='#ddd';
  cx.beginPath();cx.moveTo(-10,HY2+8);cx.lineTo(-12,HY2+14);cx.lineTo(12,HY2+14);cx.lineTo(10,HY2+8);cx.closePath();cx.fill();
  cx.fillStyle='#bbb';
  cx.beginPath();cx.moveTo(-10,HY2+8);cx.lineTo(-12,HY2+14);cx.lineTo(12,HY2+14);cx.lineTo(10,HY2+8);cx.closePath();cx.fill();
  // neck roll
  cx.fillStyle='#1a1a2e';
  cx.beginPath();cx.moveTo(-10,HY2+12);cx.lineTo(-8,HY2+18);cx.lineTo(8,HY2+18);cx.lineTo(10,HY2+12);cx.closePath();cx.fill();
  // helmet vents on top
  cx.fillStyle='rgba(0,0,0,.5)';
  cx.fillRect(-6,HY2-15,3,4);cx.fillRect(-1,HY2-16,4,5);cx.fillRect(5,HY2-15,3,4);
  // reflective strip
  cx.strokeStyle='rgba(255,255,255,.3)';cx.lineWidth=1.5;
  cx.beginPath();cx.arc(0,HY2,13,Math.PI*.2,Math.PI*.8);cx.stroke();

  cx.restore();
}


// ─── HUD ───────────────────────────────────────────────────────────
function hud(){
  cx.fillStyle='rgba(0,0,0,.55)';pill(8,8,110,28,6);cx.fill();
  cx.fillStyle='#9ae62a';cx.font='bold 10px Courier New,monospace';cx.textAlign='left';cx.fillText('KM',16,26);
  cx.fillStyle='#fff';cx.font='bold 13px Courier New,monospace';cx.fillText(('     '+score).slice(-5),38,26);
  for(var i=0;i<3;i++){
    var bx2=W-18-i*22;cx.fillStyle=i<lives?'#e05510':'#2a2a2a';
    cx.beginPath();cx.arc(bx2,20,8,0,Math.PI*2);cx.fill();
    if(i<lives){cx.fillStyle='rgba(255,255,255,.3)';cx.beginPath();cx.arc(bx2-2,16,3,0,Math.PI*2);cx.fill();}
  }
  var spd=(speed-1.6)/3.2;
  cx.fillStyle='rgba(0,0,0,.45)';pill(8,H-22,76,14,4);cx.fill();
  cx.fillStyle='hsl('+(120-spd*120)+',80%,50%)';pill(8,H-22,Math.max(4,76*spd),14,4);cx.fill();
  cx.fillStyle='rgba(255,255,255,.7)';cx.font='7px monospace';cx.textAlign='left';cx.fillText('VELOCIDAD',12,H-12);
  if(best>0){cx.fillStyle='rgba(0,0,0,.4)';pill(8,42,110,18,4);cx.fill();
    cx.fillStyle='#aaa';cx.font='8px monospace';cx.fillText('RECORD: '+best+' KM',14,54);}
}
function menu(){
  cx.fillStyle='rgba(0,0,0,.75)';cx.fillRect(0,0,W,H);
  cx.fillStyle='#e05510';cx.font='bold 38px Impact,Arial Black,sans-serif';cx.textAlign='center';
  cx.fillText('TRAIL',W/2,H/2-30);cx.fillText('RIPPER',W/2,H/2+14);
  cx.fillStyle='rgba(224,85,16,.25)';cx.fillRect(W/2-100,H/2-38,200,66);
  cx.fillStyle='#ccc';cx.font='9px monospace';cx.fillText('← →  MOVER     ↑ / SPACE  SALTAR',W/2,H/2+44);
  if(fn%44<28){cx.fillStyle='#9ae62a';cx.font='bold 11px monospace';cx.fillText('[ TOCA PARA INICIAR ]',W/2,H/2+72);}
}
function gameover(){
  cx.fillStyle='rgba(0,0,0,.82)';cx.fillRect(0,0,W,H);
  cx.fillStyle='#e05510';cx.font='bold 30px Impact,Arial Black,sans-serif';cx.textAlign='center';
  cx.fillText('¡ CAIDA !',W/2,H/2-70);
  cx.fillStyle='rgba(255,255,255,.07)';pill(W/2-110,H/2-52,220,80,8);cx.fill();
  cx.fillStyle='#fff';cx.font='13px Courier New,monospace';cx.fillText('KM RECORRIDOS: '+score,W/2,H/2-18);
  if(score>0&&score===best){cx.fillStyle='#9ae62a';cx.font='bold 12px monospace';cx.fillText('★  NUEVO RECORD  ★',W/2,H/2+10);}
  else{cx.fillStyle='#888';cx.font='10px monospace';cx.fillText('RECORD: '+best+' KM',W/2,H/2+10);}
  if(fn%44<28){cx.fillStyle='#e05510';cx.font='bold 11px monospace';cx.fillText('[ PRESIONA PARA REINTENTAR ]',W/2,H/2+55);}
}

// ─── LOOP ──────────────────────────────────────────────────────────
function loop(){
  requestAnimationFrame(loop);
  try{
    fn++;
    cx.clearRect(0,0,W,H);
    sky();mountains();trail();forest();obstacles();drawRider();
    if(phase==='playing'){update();hud();}
    else if(phase==='menu'){menu();}
    else if(phase==='gameover'){hud();gameover();}
  }catch(e){console.error('ERR:',e);}
}
loop();
</script>
